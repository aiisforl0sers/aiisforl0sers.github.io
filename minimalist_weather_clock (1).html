<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Weather & Time</title>
    
    <!-- Google Fonts for rounded style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Tailwind CSS for layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for the specific line-art style seen in the screenshot -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom styling to match the screenshot's specific colors and typography */
        body {
            background-color: #F9F8F1; /* Off-white/cream background */
            color: #4A4A45; /* Dark brownish-gray text */
            font-family: 'Varela Round', ui-rounded, sans-serif; /* Rounded font */
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        .time-display {
            font-size: 4rem; /* Reduced from 5.5rem */
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        @media (min-width: 640px) {
            .time-display {
                font-size: 6rem; /* Reduced from 8rem */
            }
        }

        /* Subtle pulse for loading state */
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* --- New Features Styles --- */
        body {
            transition: background-color 2s ease, color 2s ease;
        }
        
        body.dark-mode {
            background-color: #1a1a18; /* Dark charcoal */
            color: #eae8d9; /* Off-white text */
        }

        /* Gentle swaying for the tree */
        @keyframes sway {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(2deg); }
        }
        .animate-sway {
            animation: sway 5s ease-in-out infinite;
            transform-origin: bottom center;
        }
        
        /* Slow float for the weather icon */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center">

    <!-- Main Container -->
    <div class="flex flex-col items-center transition-opacity duration-1000" id="app-container">
        
        <!-- Date Display -->
        <div class="text-xs sm:text-sm tracking-[0.3em] font-medium opacity-60 mb-2 sm:mb-4 whitespace-nowrap" id="date-display">
            -- , -- --
        </div>

        <!-- Time Display -->
        <div class="time-display flex items-center justify-center whitespace-nowrap" id="time">
            -- : --
        </div>

        <!-- Weather Display -->
        <div class="flex items-center gap-8 mt-2 sm:mt-6 text-4xl sm:text-5xl">
            <!-- Dynamic Weather Icon with ambient float -->
            <i class="ph ph-cloud-sun loading transition-all duration-500 animate-float" id="weather-icon"></i>
            
            <!-- Temperature (Interactive Toggle) -->
            <div class="flex flex-col items-center cursor-pointer group" onclick="toggleTemperatureUnit()" title="Click to change unit">
                <div class="flex items-center gap-1 sm:gap-2 group-hover:scale-105 transition-transform">
                    <i class="ph ph-thermometer text-3xl sm:text-5xl"></i>
                    <span id="temperature" class="font-bold tracking-wider loading">--&deg;</span>
                </div>
                <!-- High & Low Expected -->
                <div id="high-low" class="text-[0.65rem] sm:text-xs font-normal tracking-widest mt-1 opacity-60 loading">
                    H: --&deg; &nbsp; L: --&deg;
                </div>
            </div>
        </div>
        
        <!-- Seasonal SVG Tree with ambient sway -->
        <div class="mt-4 sm:mt-6 flex justify-center opacity-80 animate-sway">
            <svg width="120" height="120" viewBox="0 0 100 100" class="overflow-visible">
                <!-- Trunk and main branches (CurrentColor adapts to Dark Mode) -->
                <path d="M50 95 L50 45 M50 65 L35 50 M50 55 L65 40" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                
                <!-- Leaves Group (Colors change via JS) -->
                <g id="tree-leaves" class="transition-all duration-1000 ease-in-out origin-bottom" stroke-width="3" stroke="currentColor" fill="none">
                    <circle cx="50" cy="30" r="18" />
                    <circle cx="32" cy="45" r="14" />
                    <circle cx="68" cy="45" r="14" />
                    <circle cx="50" cy="15" r="12" />
                </g>
                
                <!-- Winter Snow and Bare branches (Hidden by default) -->
                <g id="tree-snow" class="transition-all duration-1000 ease-in-out" opacity="0" fill="currentColor">
                    <!-- Snowflakes -->
                    <circle cx="30" cy="20" r="1.5" />
                    <circle cx="70" cy="25" r="1.5" />
                    <circle cx="50" cy="5" r="1.5" />
                    <circle cx="20" cy="40" r="1.5" />
                    <circle cx="80" cy="55" r="1.5" />
                    <!-- Extra bare branches -->
                    <path d="M35 50 L25 45 M65 40 L75 35 M50 45 L45 35" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
                </g>
            </svg>
        </div>

    </div>

    <!-- Location Status (Subtle) -->
    <div id="status-message" class="absolute bottom-4 text-xs tracking-widest opacity-40">
        Locating...
    </div>

    <script>
        // --- State Variables ---
        let weatherData = { tempF: null, highF: null, lowF: null };
        let isCelsius = false;

        // --- Clock & Date Logic ---
        function updateTimeAndDate() {
            const now = new Date();
            
            // Time Logic
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours % 12 || 12; 
            
            const hoursStr = hours.toString().padStart(2, '0');
            const minutesStr = minutes.toString().padStart(2, '0');
            const formattedTime = `${hoursStr.charAt(0)} ${hoursStr.charAt(1)} : ${minutesStr.charAt(0)} ${minutesStr.charAt(1)}`;
            document.getElementById('time').innerText = formattedTime;

            // Date Logic
            const days = ['S U N', 'M O N', 'T U E', 'W E D', 'T H U', 'F R I', 'S A T'];
            const months = ['J A N', 'F E B', 'M A R', 'A P R', 'M A Y', 'J U N', 'J U L', 'A U G', 'S E P', 'O C T', 'N O V', 'D E C'];
            
            const dayStr = days[now.getDay()];
            const monthStr = months[now.getMonth()];
            const dateNum = now.getDate().toString().split('').join(' '); // Spaces out the digits
            
            document.getElementById('date-display').innerText = `${dayStr} ,  ${monthStr}  ${dateNum}`;
        }

        setInterval(updateTimeAndDate, 1000);
        updateTimeAndDate(); // Initial call

        // --- Interactive Temperature Logic ---
        function fToC(f) { return (f - 32) * 5/9; }

        function toggleTemperatureUnit() {
            if (weatherData.tempF === null) return; // Prevent toggle if no data
            isCelsius = !isCelsius;
            renderWeather();
        }

        function renderWeather() {
            const tempEl = document.getElementById('temperature');
            const hlEl = document.getElementById('high-low');

            const t = isCelsius ? fToC(weatherData.tempF) : weatherData.tempF;
            const h = isCelsius ? fToC(weatherData.highF) : weatherData.highF;
            const l = isCelsius ? fToC(weatherData.lowF) : weatherData.lowF;

            tempEl.innerHTML = `${Math.round(t)}&deg;`;
            hlEl.innerHTML = `H: ${Math.round(h)}&deg; &nbsp; L: ${Math.round(l)}&deg;`;
            
            tempEl.classList.remove('loading');
            hlEl.classList.remove('loading');
        }

        // --- Seasonal Scene Logic ---
        function updateSeason() {
            const month = new Date().getMonth(); // 0 = Jan, 11 = Dec
            const leaves = document.getElementById('tree-leaves');
            const snow = document.getElementById('tree-snow');
            
            let season = '';
            if (month === 11 || month <= 1) season = 'winter'; // Dec, Jan, Feb
            else if (month >= 2 && month <= 4) season = 'spring'; // Mar, Apr, May
            else if (month >= 5 && month <= 7) season = 'summer'; // Jun, Jul, Aug
            else season = 'autumn'; // Sep, Oct, Nov

            if (season === 'winter') {
                leaves.style.opacity = '0';
                snow.style.opacity = '1';
            } else {
                leaves.style.opacity = '1';
                snow.style.opacity = '0';
                
                // Muted colors to match the minimalist aesthetic
                if (season === 'spring') {
                    leaves.style.color = '#9CB494'; // Muted sage green
                } else if (season === 'summer') {
                    leaves.style.color = '#6D8262'; // Deeper forest green
                } else if (season === 'autumn') {
                    leaves.style.color = '#C18C61'; // Muted terracotta orange
                }
            }
        }

        updateSeason(); // Call immediately on load

        // --- Weather & Environment Logic ---
        function getWeatherIconClass(wmoCode) {
            const code = parseInt(wmoCode);
            if (code === 0) return 'ph-sun'; // Clear
            if ([1, 2].includes(code)) return 'ph-cloud-sun'; // Partly cloudy
            if (code === 3) return 'ph-cloud'; // Overcast
            if ([45, 48].includes(code)) return 'ph-cloud-fog'; // Fog
            if ([51, 53, 55, 56, 57].includes(code)) return 'ph-cloud-drizzle'; // Drizzle
            if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return 'ph-cloud-rain'; // Rain
            if ([71, 73, 75, 77, 85, 86].includes(code)) return 'ph-cloud-snow'; // Snow
            if ([95, 96, 99].includes(code)) return 'ph-cloud-lightning'; // Thunderstorm
            
            return 'ph-cloud-sun'; // Fallback
        }

        function updateLighting(sunriseISO, sunsetISO) {
            const now = new Date();
            const sunrise = new Date(sunriseISO);
            const sunset = new Date(sunsetISO);
            
            // Check if current time is before sunrise OR after sunset
            if (now < sunrise || now > sunset) {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                // Fetch current weather, high/low, and sunrise/sunset based on location
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.current_weather) {
                    // Store data for unit toggling
                    weatherData.tempF = data.current_weather.temperature;
                    weatherData.highF = data.daily.temperature_2m_max[0];
                    weatherData.lowF = data.daily.temperature_2m_min[0];

                    renderWeather();

                    // Update Icon
                    const weatherCode = data.current_weather.weathercode;
                    const iconEl = document.getElementById('weather-icon');
                    iconEl.className = `ph ${getWeatherIconClass(weatherCode)} transition-all duration-500 animate-float`;
                    
                    // Update Ambient Lighting (Dark Mode)
                    updateLighting(data.daily.sunrise[0], data.daily.sunset[0]);

                    document.getElementById('status-message').innerText = "";
                }
            } catch (error) {
                console.error("Failed to fetch weather:", error);
                document.getElementById('status-message').innerText = "Failed to load weather.";
            }
        }

        // --- Geolocation Logic ---
        function initApp() {
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        // Success: Use user's real location
                        fetchWeather(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        console.warn("Geolocation denied or failed, using default location (Magna, Utah).");
                        document.getElementById('status-message').innerText = "Using default location.";
                        // Fallback to Magna, Utah based on provided context
                        fetchWeather(40.7091, -112.0983);
                    },
                    { timeout: 5000 }
                );
            } else {
                console.warn("Geolocation not supported, using default location.");
                fetchWeather(40.7091, -112.0983);
            }
        }

        // Start app
        initApp();
    </script>
</body>
</html>
