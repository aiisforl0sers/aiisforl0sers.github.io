<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linger</title>
    
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            margin: 0;
            overflow: hidden; 
        }
        
        .slide-transition {
            transition: transform 0.3s ease-out, opacity 0.3s ease-in-out;
        }

        .description-card {
            background-color: transparent;
            border-radius: 20px;
            padding: 12px 20px;
            box-shadow: none;
            margin-top: 10px; 
            z-index: 10;
            text-align: center;
            color: #1f2937;
            border: none;
        }

        @media (max-width: 768px) {
            .description-card {
                width: 95%;
                margin-top: 5px;
            }
        }

        .slideshow-btn {
            background-color: #ffffff;
            color: #1f2937;
            border-radius: 20px;
            padding: 10px 20px;
            box-shadow: none;
            transition: opacity 0.3s ease-in-out, transform 0.2s ease-in-out;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            z-index: 30;
        }

        .slideshow-btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        body.hide-info .description-card {
            display: none !important;
        }
        
        .art-frame {
            background-color: #fdfbf7;
            padding: 16px; 
            border: 40px solid #c5a059; 
            border-image-source: url('my-frame.png');
            border-image-slice: 60;
            border-image-width: 40px;
            border-image-repeat: stretch;
            box-shadow: 
                inset 0px 0px 10px rgba(0,0,0,0.2), 
                0px 15px 35px rgba(0,0,0,0.3);      
            position: relative;
            overflow: hidden; 
            display: inline-block;
            border-radius: 2px;
        }

        /* Modifier for favorites masonry grid to scale down frame thickness */
        .fav-frame {
            padding: 8px !important;
            border-width: 20px !important;
            border-image-width: 20px !important;
        }

        .artwork-image {
            max-height: 40vh;
            width: auto;
            max-width: 100%;
            display: block;
        }

        @media (min-height: 800px) {
            .artwork-image {
                max-height: 50vh;
            }
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Swipe Handle -->
    <div id="swipeHandle" class="fixed top-4 left-1/2 -translate-x-1/2 z-[70] flex flex-col items-center cursor-pointer text-gray-500 hover:opacity-70 transition-opacity w-32">
        <div class="relative w-10 h-6 flex items-center justify-center mt-2 mb-1">
            <div id="lineLeft" class="absolute w-[20px] h-[3px] bg-gray-500 rounded-full left-0 origin-right transition-transform duration-300 -rotate-[40deg]"></div>
            <div id="lineRight" class="absolute w-[20px] h-[3px] bg-gray-500 rounded-full right-0 origin-left transition-transform duration-300 rotate-[40deg]"></div>
        </div>
        <span id="swipeText" class="text-sm font-['Times_New_Roman'] text-center leading-tight tracking-wide transition-opacity duration-1000 opacity-100 pointer-events-none">swipe down to view saved</span>
    </div>

    <!-- Style Filter Dropdown -->
    <div id="styleFilterContainer" class="absolute top-6 left-6 md:top-10 md:left-10 z-30">
        <select id="styleFilter" class="bg-transparent border-none text-gray-800 font-['Times_New_Roman'] text-lg md:text-xl outline-none cursor-pointer hover:opacity-70 transition-opacity">
            <option value="painting" data-min="0" data-max="2025">All Paintings</option>
            <option value="Impressionism" data-min="1850" data-max="1930">Impressionism</option>
            <option value="Renaissance" data-min="1300" data-max="1650">Renaissance</option>
            <option value="Modernism" data-min="1880" data-max="1980">Modern Art</option>
            <option value="portrait" data-min="0" data-max="2025">Portraits</option>
            <option value="landscape" data-min="0" data-max="2025">Landscapes</option>
        </select>
    </div>

    <!-- Required Viewing Timer -->
    <div id="artTimer" class="absolute top-6 right-6 md:top-10 md:right-10 z-30 font-['Times_New_Roman'] text-gray-500 text-lg md:text-xl transition-opacity duration-500 opacity-0 pointer-events-none tracking-wide">
        0:30
    </div>

    <!-- Slideshow Button -->
    <select id="slideshowBtn" class="absolute bottom-6 right-6 md:bottom-10 md:right-10 slideshow-btn outline-none cursor-pointer appearance-none text-center px-4 py-2">
        <option value="" disabled selected hidden>Start Slideshow...</option>
        <option value="with-info">With Info Box</option>
        <option value="without-info">Without Info Box</option>
    </select>

    <!-- Left Navigation Arrow -->
    <button id="prevBtn" class="hidden md:block absolute left-4 md:left-10 top-1/2 -translate-y-1/2 p-2 text-gray-300 hover:text-gray-800 transition-all duration-300 z-20 focus:outline-none">
        <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <!-- Artwork Container -->
    <div id="artworkWrapper" class="absolute max-w-[85vw] md:max-w-[70vw] slide-transition opacity-0 translate-x-0 flex flex-col items-center">
        <div class="art-frame">
            <img src="" alt="Artwork" class="artwork-image">
        </div>
        
        <div class="description-card max-w-[320px] md:max-w-[500px]">
            <div class="desc-content text-sm md:text-base leading-relaxed"></div>
        </div>
    </div>

    <!-- Right Navigation Arrow -->
    <button id="nextBtn" class="hidden md:block absolute right-4 md:left-auto right-4 md:right-10 top-1/2 -translate-y-1/2 p-2 text-gray-300 hover:text-gray-800 transition-all duration-300 z-20 focus:outline-none">
        <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
        </svg>
    </button>

    <!-- Favorites Fixed Panel -->
    <div id="favoritesPanel" class="fixed inset-0 bg-[#fdfbf7] z-[60] transform -translate-y-full transition-transform duration-500 ease-in-out flex flex-col">
        <div class="pt-16 pb-2 flex justify-center items-center bg-[#fdfbf7]">
            <!-- Header area kept for spacing below the fixed sticky handle -->
        </div>
        <div id="favoritesContainer" class="flex-1 overflow-y-auto p-4 md:p-8 columns-2 md:columns-3 lg:columns-4 gap-4 md:gap-6 bg-[#fdfbf7]">
            <!-- Dynamic Masonry Layout Content -->
        </div>
    </div>

    <!-- Enlarged View Overlay -->
    <div id="enlargedViewOverlay" class="fixed inset-0 bg-[#fdfbf7]/95 backdrop-blur-sm z-[80] opacity-0 pointer-events-none transition-opacity duration-300 flex flex-col items-center justify-center" onclick="closeEnlargedView()">
        <div id="enlargedImageWrapper" class="transition-all duration-500 transform scale-90 opacity-0 flex flex-col items-center justify-center w-full h-full max-h-[85vh] p-4" onclick="event.stopPropagation()">
            <div class="art-frame mb-6 flex items-center justify-center">
                <img id="enlargedImage" src="" alt="Enlarged Artwork" class="max-h-[60vh] w-auto object-contain shadow-2xl">
            </div>
            
            <button id="removeFavBtn" class="bookmark-btn focus:outline-none transition-transform hover:scale-110 text-gray-800 flex flex-col items-center gap-2 mt-4 cursor-pointer" title="Remove from saved">
                <svg class="w-10 h-10" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5v16l7-3.5L19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <script>
        let artworks = [];
        let currentIndex = 0;
        let isTransitioning = true; 
        let isSlideshowActive = false;
        let slideshowMode = null;
        let favorites = JSON.parse(localStorage.getItem('lingerFavorites') || '[]');

        // Viewing Timer Variables
        let canNavigate = false;
        let artTimerInterval = null;
        const VIEWING_TIME = 30; // 30 seconds for manual viewing lock
        const SLIDESHOW_TIME = 120; // 2 minutes between auto-slides

        // DOM Elements
        let currentWrapper = document.getElementById('artworkWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideshowBtn = document.getElementById('slideshowBtn');
        const styleFilterContainer = document.getElementById('styleFilterContainer');
        const styleFilter = document.getElementById('styleFilter');
        const timerEl = document.getElementById('artTimer');
        const swipeHandle = document.getElementById('swipeHandle');
        const lineLeft = document.getElementById('lineLeft');
        const lineRight = document.getElementById('lineRight');
        const swipeText = document.getElementById('swipeText');
        const favoritesPanel = document.getElementById('favoritesPanel');
        const favoritesContainer = document.getElementById('favoritesContainer');

        // Enlarged View Elements
        const enlargedViewOverlay = document.getElementById('enlargedViewOverlay');
        const enlargedImageWrapper = document.getElementById('enlargedImageWrapper');
        const enlargedImage = document.getElementById('enlargedImage');
        const removeFavBtn = document.getElementById('removeFavBtn');
        let currentlyEnlargedId = null;

        currentWrapper.querySelector('.desc-content').innerHTML = "Fetching masterpieces from the Art Institute of Chicago...";

        // Hide swipe instructions after 10 seconds
        setTimeout(() => {
            if (swipeText) swipeText.style.opacity = '0';
        }, 10000);

        // Favorites Logic
        function toggleFavorite(artwork, imgUrl) {
            const index = favorites.findIndex(f => f.id === artwork.id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push({
                    id: artwork.id,
                    title: artwork.title,
                    artist: artwork.artist_title,
                    imageUrl: imgUrl
                });
            }
            localStorage.setItem('lingerFavorites', JSON.stringify(favorites));
            renderFavorites();
        }

        function openEnlargedView(id, imageUrl) {
            currentlyEnlargedId = id;
            enlargedImage.src = imageUrl;
            
            enlargedViewOverlay.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                enlargedImageWrapper.classList.remove('scale-90', 'opacity-0');
                enlargedImageWrapper.classList.add('scale-100', 'opacity-100');
            }, 50);
        }

        function closeEnlargedView() {
            enlargedImageWrapper.classList.remove('scale-100', 'opacity-100', 'translate-y-[100vh]');
            enlargedImageWrapper.classList.add('scale-90', 'opacity-0');
            
            setTimeout(() => {
                enlargedViewOverlay.classList.add('opacity-0', 'pointer-events-none');
                currentlyEnlargedId = null;
                enlargedImage.src = '';
            }, 300);
        }

        removeFavBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (currentlyEnlargedId) {
                // Animate sliding down off screen
                enlargedImageWrapper.classList.remove('scale-100');
                enlargedImageWrapper.classList.add('translate-y-[100vh]', 'opacity-0');
                
                setTimeout(() => {
                    // Update state and re-render grid
                    favorites = favorites.filter(f => f.id !== currentlyEnlargedId);
                    localStorage.setItem('lingerFavorites', JSON.stringify(favorites));
                    renderFavorites();
                    
                    // Reset overlay state silently after animation completes
                    enlargedViewOverlay.classList.add('opacity-0', 'pointer-events-none');
                    enlargedImageWrapper.classList.remove('translate-y-[100vh]');
                    enlargedImageWrapper.classList.add('scale-90');
                    
                    currentlyEnlargedId = null;
                    enlargedImage.src = '';
                }, 500);
                
                // Keep UI synced for main view if currently observing this specific artwork
                const mainBBtn = currentWrapper.querySelector('.bookmark-btn svg');
                if (mainBBtn && artworks[currentIndex] && artworks[currentIndex].id === currentlyEnlargedId) {
                    mainBBtn.setAttribute('fill', 'none');
                }
            }
        });

        function renderFavorites() {
            if (favorites.length === 0) {
                favoritesContainer.innerHTML = `<div class="col-span-full text-center text-gray-500 mt-10 font-['Times_New_Roman'] text-lg">No saved artworks yet.</div>`;
                return;
            }
            
            favoritesContainer.innerHTML = favorites.map(fav => `
                <div class="break-inside-avoid mb-4 cursor-pointer hover:opacity-90 transition-opacity" onclick="openEnlargedView(${fav.id}, '${fav.imageUrl}')">
                    <div class="art-frame fav-frame w-full max-w-full block">
                        <img src="${fav.imageUrl}" class="w-full h-auto block" alt="${fav.title}">
                    </div>
                </div>
            `).join('');
        }

        function openFavorites() {
            favoritesPanel.classList.remove('-translate-y-full');
            lineLeft.classList.replace('-rotate-[40deg]', 'rotate-0');
            lineRight.classList.replace('rotate-[40deg]', 'rotate-0');
            renderFavorites();
        }

        function closeFavorites() {
            favoritesPanel.classList.add('-translate-y-full');
            lineLeft.classList.replace('rotate-0', '-rotate-[40deg]');
            lineRight.classList.replace('rotate-0', 'rotate-[40deg]');
        }

        function toggleFavoritesPanel() {
            const isFavOpen = !favoritesPanel.classList.contains('-translate-y-full');
            if (isFavOpen) {
                closeFavorites();
            } else {
                openFavorites();
            }
        }

        swipeHandle.addEventListener('click', toggleFavoritesPanel);

        // Fallback for fullscreen if blocked by iframe permissions
        function enterPseudoFullscreen(imgElement) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-[#fdfbf7]/95 backdrop-blur-sm z-[100] flex flex-col items-center justify-center cursor-pointer transition-opacity duration-300 opacity-0';
            
            const imgWrapper = document.createElement('div');
            imgWrapper.className = 'art-frame transition-transform duration-500 transform scale-90';
            
            const img = document.createElement('img');
            img.src = imgElement.src;
            img.className = 'max-h-[85vh] w-auto object-contain shadow-2xl';
            
            imgWrapper.appendChild(img);
            overlay.appendChild(imgWrapper);
            document.body.appendChild(overlay);
            
            requestAnimationFrame(() => {
                overlay.classList.remove('opacity-0');
                imgWrapper.classList.remove('scale-90');
                imgWrapper.classList.add('scale-100');
            });
            
            const closeOverlay = () => {
                overlay.classList.add('opacity-0');
                imgWrapper.classList.remove('scale-100');
                imgWrapper.classList.add('scale-90');
                setTimeout(() => overlay.remove(), 300);
            };
            
            overlay.addEventListener('click', closeOverlay);
        }

        // Action Buttons Setup (Bookmark & Fullscreen)
        function setupActionButtons(wrapper, currentArtwork, imageUrl) {
            const bBtn = wrapper.querySelector('.bookmark-btn');
            const fBtn = wrapper.querySelector('.fullscreen-btn');
            const artworkImage = wrapper.querySelector('.artwork-image');

            if (bBtn) {
                bBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(currentArtwork, imageUrl);
                    const isFav = favorites.some(f => f.id === currentArtwork.id);
                    bBtn.querySelector('svg').setAttribute('fill', isFav ? 'currentColor' : 'none');
                });
            }

            if (fBtn) {
                fBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    try {
                        let fsPromise;
                        if (artworkImage.requestFullscreen) {
                            fsPromise = artworkImage.requestFullscreen();
                        } else if (artworkImage.webkitRequestFullscreen) {
                            fsPromise = artworkImage.webkitRequestFullscreen();
                        } else if (artworkImage.msRequestFullscreen) {
                            fsPromise = artworkImage.msRequestFullscreen();
                        }

                        if (fsPromise) {
                            fsPromise.catch(err => {
                                console.warn("Native fullscreen blocked by permissions, using fallback.", err);
                                enterPseudoFullscreen(artworkImage);
                            });
                        } else {
                            enterPseudoFullscreen(artworkImage);
                        }
                    } catch (err) {
                        enterPseudoFullscreen(artworkImage);
                    }
                });
            }
        }

        // Unified Timer Logic
        function startTimer() {
            clearInterval(artTimerInterval);
            canNavigate = false;
            
            let isSlideshow = isSlideshowActive;
            let timeLeft = isSlideshow ? SLIDESHOW_TIME : VIEWING_TIME;
            
            timerEl.style.opacity = '1';
            timerEl.style.color = '#6b7280'; 
            
            if (!isSlideshow) {
                prevBtn.style.opacity = '0.2';
                nextBtn.style.opacity = '0.2';
                prevBtn.style.cursor = 'not-allowed';
                nextBtn.style.cursor = 'not-allowed';
            }

            const updateTimerDisplay = () => {
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timerEl.innerHTML = `${m}:${s.toString().padStart(2, '0')}`;
            };
            
            updateTimerDisplay();

            artTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    updateTimerDisplay();
                } else {
                    clearInterval(artTimerInterval);
                    canNavigate = true;
                    
                    if (isSlideshowActive) {
                        navigate(1); 
                    } else {
                        timerEl.innerHTML = "You may move on";
                        prevBtn.style.opacity = '1';
                        nextBtn.style.opacity = '1';
                        prevBtn.style.cursor = 'pointer';
                        nextBtn.style.cursor = 'pointer';
                        
                        setTimeout(() => {
                            if (canNavigate && !isSlideshowActive) timerEl.style.opacity = '0';
                        }, 2500);
                    }
                }
            }, 1000);
        }

        async function fetchArtworks(searchQuery = "painting", forceFirstPage = false, minYear = 0, maxYear = 2025) {
            try {
                const maxPage = searchQuery === "painting" ? 10 : 3;
                const page = forceFirstPage ? 1 : Math.floor(Math.random() * maxPage) + 1;
                
                const response = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(searchQuery)}&query[term][is_public_domain]=true&limit=100&page=${page}&fields=id,title,image_id,artist_title,date_display,date_start,thumbnail,medium_display`);
                const data = await response.json();
                
                if (data && data.data) {
                    artworks = data.data.filter(art => {
                        if (!art.image_id) return false;
                        const year = art.date_start;
                        if (minYear > 0 || maxYear < 2025) {
                            if (!year) return false; 
                            if (year < minYear || year > maxYear) return false;
                        }
                        return true;
                    });
                    
                    artworks = artworks.sort(() => Math.random() - 0.5);
                    
                    if (artworks.length > 0) {
                        currentIndex = 0;
                        isTransitioning = false;
                        loadAndDisplayArtwork(currentIndex, 0);
                    } else if (!forceFirstPage) {
                        fetchArtworks(searchQuery, true, minYear, maxYear); 
                    } else {
                        currentWrapper.querySelector('.desc-content').innerHTML = "No artworks found for this category.";
                        currentWrapper.classList.remove('opacity-0');
                        isTransitioning = false; 
                    }
                } else {
                    throw new Error("Invalid data structure returned from API.");
                }
            } catch (error) {
                console.error("Error fetching art:", error);
                currentWrapper.querySelector('.desc-content').innerHTML = "Failed to load artworks. Please select a category to try again.";
                currentWrapper.classList.remove('opacity-0');
                isTransitioning = false; 
            }
        }

        styleFilter.addEventListener('change', (e) => {
            if (isTransitioning) return;
            
            clearInterval(artTimerInterval);
            timerEl.style.opacity = '0';
            canNavigate = true; 
            
            isTransitioning = true;
            currentWrapper.classList.add('opacity-0'); 
            
            const selectedOption = e.target.options[e.target.selectedIndex];
            const query = selectedOption.value;
            const minYear = parseInt(selectedOption.dataset.min);
            const maxYear = parseInt(selectedOption.dataset.max);

            setTimeout(() => {
                currentWrapper.querySelector('.desc-content').innerHTML = `Curating ${selectedOption.text}...`;
                fetchArtworks(query, false, minYear, maxYear);
            }, 500); 
        });

        function loadAndDisplayArtwork(index, direction = 0) {
            isTransitioning = true;
            
            const data = artworks[index];
            const title = data.title || 'Unknown Title';
            const date = data.date_display || 'Unknown Date';
            const artist = data.artist_title || 'Unknown Artist';
            const description = (data.thumbnail && data.thumbnail.alt_text) 
                                ? data.thumbnail.alt_text 
                                : (data.medium_display || '');

            const artworkLink = `https://www.artic.edu/artworks/${data.id}`;
            const isFav = favorites.some(fav => fav.id === data.id);
            const imageUrl = `https://www.artic.edu/iiif/2/${data.image_id}/full/843,/0/default.jpg`;
            
            const actionBtnsHtml = `
                <div class="flex justify-center items-center gap-8 mt-2 pb-1">
                    <button class="bookmark-btn focus:outline-none transition-transform hover:scale-110 text-gray-500">
                        <svg class="w-8 h-8" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5v16l7-3.5L19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2z"></path>
                        </svg>
                    </button>
                    <button class="fullscreen-btn focus:outline-none transition-transform hover:scale-110 text-gray-500">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
                        </svg>
                    </button>
                </div>
            `;

            const formattedDesc = `
                <div class="mb-1">
                    <a href="${artworkLink}" target="_blank" class="font-bold text-lg hover:text-gray-500 transition-colors" title="View on Art Institute of Chicago website">${title}</a> 
                    <span class="italic text-gray-600">(${date})</span>
                </div>
                <div class="font-medium text-gray-800 uppercase text-xs tracking-widest mb-3">${artist}</div>
                <div class="w-10 h-[1px] bg-gray-400 mx-auto mb-3"></div>
                <div class="text-sm text-gray-700 leading-relaxed">${description}</div>
                ${actionBtnsHtml}
            `;
            
            if (direction === 0) {
                const artworkImage = currentWrapper.querySelector('img');
                const artworkDesc = currentWrapper.querySelector('.desc-content');
                artworkDesc.innerHTML = formattedDesc;
                setupActionButtons(currentWrapper, data, imageUrl);
                
                artworkImage.onload = () => {
                    currentWrapper.classList.remove('opacity-0');
                    attachZoom(artworkImage);
                    isTransitioning = false;
                    startTimer(); 
                };

                artworkImage.onerror = () => {
                    artworkDesc.innerHTML = "Error loading high-res image. Skipping to next...";
                    currentWrapper.classList.remove('opacity-0');
                    isTransitioning = false; 
                    canNavigate = true; 
                    setTimeout(() => navigate(1), 1500);
                };

                artworkImage.src = imageUrl;
                return;
            }

            const newWrapper = currentWrapper.cloneNode(true);
            const startClass = direction === 1 ? 'translate-x-[150vw]' : '-translate-x-[150vw]';
            
            newWrapper.className = `absolute max-w-[85vw] md:max-w-[70vw] flex flex-col items-center slide-transition opacity-100 ${startClass}`;
            
            const newImage = newWrapper.querySelector('img');
            const newDesc = newWrapper.querySelector('.desc-content');
            newDesc.innerHTML = formattedDesc;
            
            document.body.appendChild(newWrapper);
            setupActionButtons(newWrapper, data, imageUrl);
            
            newImage.onload = () => {
                attachZoom(newImage);
                void newWrapper.offsetWidth;
                
                const exitClass = direction === 1 ? '-translate-x-[150vw]' : 'translate-x-[150vw]';
                
                currentWrapper.classList.remove('translate-x-0');
                currentWrapper.classList.add(exitClass);
                
                newWrapper.classList.remove(startClass);
                newWrapper.classList.add('translate-x-0');
                
                setTimeout(() => {
                    currentWrapper.remove();
                    currentWrapper = newWrapper;
                    isTransitioning = false;
                    startTimer(); 
                }, 300);
            };

            newImage.onerror = () => {
                newWrapper.remove();
                isTransitioning = false; 
                canNavigate = true; 
                setTimeout(() => navigate(direction), 1500);
            };

            newImage.src = imageUrl;
        }

        function navigate(direction) {
            if (isTransitioning || artworks.length === 0) return;
            
            if (!canNavigate) {
                timerEl.style.color = '#ef4444'; 
                setTimeout(() => {
                    if (!canNavigate) timerEl.style.color = '#6b7280';
                }, 300);
                return;
            }
            
            currentIndex += direction;
            
            if (currentIndex < 0) {
                currentIndex = artworks.length - 1;
                loadAndDisplayArtwork(currentIndex, direction);
                return;
            }
            
            if (currentIndex >= artworks.length) {
                isTransitioning = true; 
                canNavigate = true;
                clearInterval(artTimerInterval);
                timerEl.style.opacity = '0';
                currentWrapper.querySelector('.desc-content').innerHTML = "Fetching a new gallery wall...";
                
                const selectedOption = styleFilter.options[styleFilter.selectedIndex];
                fetchArtworks(
                    selectedOption.value, 
                    false, 
                    parseInt(selectedOption.dataset.min), 
                    parseInt(selectedOption.dataset.max)
                ); 
                return;
            }
            
            loadAndDisplayArtwork(currentIndex, direction);
        }

        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        function attachZoom(imgElement) {
            imgElement.style.transition = "transform 0.4s ease-out";
            imgElement.style.cursor = "zoom-in";
            imgElement.style.position = "relative";

            imgElement.addEventListener("mousemove", function(e) {
                const x = (e.offsetX / this.offsetWidth) * 100;
                const y = (e.offsetY / this.offsetHeight) * 100;
                this.style.transformOrigin = `${x}% ${y}%`;
                this.style.transform = "scale(2.5)"; 
                this.style.zIndex = "50"; 
            });

            imgElement.addEventListener("mouseleave", function() {
                resetZoom(this);
            });

            imgElement.addEventListener("touchstart", function(e) {
                e.stopPropagation(); 
                handleTouchZoom(e, this);
            }, { passive: true });

            imgElement.addEventListener("touchmove", function(e) {
                e.stopPropagation(); 
                handleTouchZoom(e, this);
            }, { passive: true });

            imgElement.addEventListener("touchend", function(e) {
                e.stopPropagation(); 
                resetZoom(this);
            });

            function handleTouchZoom(e, img) {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const rect = img.getBoundingClientRect();
                    let x = ((touch.clientX - rect.left) / rect.width) * 100;
                    let y = ((touch.clientY - rect.top) / rect.height) * 100;
                    x = Math.max(0, Math.min(100, x));
                    y = Math.max(0, Math.min(100, y));

                    img.style.transformOrigin = `${x}% ${y}%`;
                    img.style.transform = "scale(2.5)"; 
                    img.style.zIndex = "50";
                }
            }

            function resetZoom(img) {
                img.style.transform = "scale(1)";
                img.style.zIndex = "1";
                setTimeout(() => {
                    if (img.style.transform === "scale(1)") {
                        img.style.transformOrigin = "center center";
                    }
                }, 400); 
            }
        }

        function startSlideshow(mode) {
            isSlideshowActive = true;
            slideshowMode = mode;
            
            slideshowBtn.style.display = 'none';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            styleFilterContainer.style.display = 'none';
            swipeHandle.style.display = 'none'; // hide during slideshow
            
            if (mode === 'without-info') {
                document.body.classList.add('hide-info');
            }
            startTimer();
        }

        function stopSlideshow() {
            if (!isSlideshowActive) return;
            isSlideshowActive = false;
            slideshowMode = null;
            
            slideshowBtn.style.display = 'block';
            slideshowBtn.value = ""; 
            
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            
            styleFilterContainer.style.display = 'block';
            swipeHandle.style.display = 'flex';
            document.body.classList.remove('hide-info');
            
            clearInterval(artTimerInterval);
            canNavigate = true;
            timerEl.style.opacity = '0';
            prevBtn.style.opacity = '1';
            nextBtn.style.opacity = '1';
            prevBtn.style.cursor = 'pointer';
            nextBtn.style.cursor = 'pointer';
        }

        slideshowBtn.addEventListener('change', (e) => {
            if (e.target.value) {
                startSlideshow(e.target.value);
            }
        });

        window.addEventListener('keydown', (e) => {
            const isFavOpen = !favoritesPanel.classList.contains('-translate-y-full');
            if (isFavOpen) {
                if (e.key === 'Escape') closeFavorites();
                return;
            }

            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
            if (e.key === 'ArrowDown') openFavorites();
            if (e.code === 'Space') {
                e.preventDefault(); 
                stopSlideshow();
            }
        });

        // Expanded Swipe Handling (X and Y coordinates)
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        
        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 35; 
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            const isFavOpen = !favoritesPanel.classList.contains('-translate-y-full');

            if (Math.abs(diffX) > Math.abs(diffY)) {
                // Horizontal Swipe logic
                if (isFavOpen) return; // Ignore horizontal swipes inside the favorites panel
                
                if (diffX < -swipeThreshold) {
                    if (canNavigate && isSlideshowActive) stopSlideshow();
                    navigate(1); 
                } else if (diffX > swipeThreshold) {
                    if (canNavigate && isSlideshowActive) stopSlideshow();
                    navigate(-1); 
                }
            } else {
                // Vertical Swipe logic
                if (diffY > swipeThreshold) {
                    // Swiped Down
                    if (!isFavOpen) {
                        openFavorites();
                    }
                } else if (diffY < -swipeThreshold) {
                    // Swiped Up
                    if (isFavOpen) {
                        // Only close if user isn't scrolling down the favorites content
                        if (favoritesContainer.scrollTop <= 0) {
                            closeFavorites();
                        }
                    }
                }
            }
        }

        document.body.addEventListener('click', (e) => {
            if (isSlideshowActive && e.target.id !== 'slideshowBtn') {
                stopSlideshow();
            }
        });

        // Initialize App
        const initialOption = styleFilter.options[styleFilter.selectedIndex];
        fetchArtworks(
            initialOption.value, 
            false, 
            parseInt(initialOption.dataset.min), 
            parseInt(initialOption.dataset.max)
        );
        renderFavorites();
    </script>
</body>
</html>
