<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Updated viewport for mobile apps: prevents zooming and supports notches (viewport-fit=cover) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS / Android Native App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F8F1">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a18">

    <title>Minimal Weather & Time</title>
    
    <!-- Google Fonts for rounded style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

    <!-- Tailwind CSS for layout and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons for the specific line-art style seen in the screenshot -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Custom styling to match the screenshot's specific colors and typography */
        html {
            height: -webkit-fill-available; /* Fixes height issues on mobile Safari */
        }
        
        body {
            background-color: #F9F8F1; /* Off-white/cream background */
            color: #4A4A45; /* Dark brownish-gray text */
            font-family: 'Varela Round', ui-rounded, sans-serif; /* Rounded font */
            margin: 0;
            overflow: hidden;
            user-select: none;
            
            /* Native app feel additions */
            overscroll-behavior: none; /* Prevents pull-to-refresh bounce */
            touch-action: manipulation; /* Disables double-tap to zoom */
            -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight */
            
            /* Safe area padding for notches and home bars */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .time-display {
            font-size: 4rem; /* Reduced from 5.5rem */
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        @media (min-width: 640px) {
            .time-display {
                font-size: 6rem; /* Reduced from 8rem */
            }
        }

        /* Subtle pulse for loading state */
        .loading {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* --- New Features Styles --- */
        body {
            transition: background-color 2s ease, color 2s ease;
        }
        
        body.dark-mode {
            background-color: #1a1a18; /* Dark charcoal */
            color: #eae8d9; /* Off-white text */
        }

        /* Gentle swaying for the tree */
        @keyframes sway {
            0%, 100% { transform: rotate(-1deg); }
            50% { transform: rotate(2deg); }
        }
        .animate-sway {
            animation: sway var(--sway-duration, 5s) ease-in-out infinite;
            transform-origin: bottom center;
        }
        
        /* Slow float for the weather icon */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        /* Adjust status message to respect mobile bottom safe area */
        #status-message {
            bottom: calc(1rem + env(safe-area-inset-bottom));
        }

        /* --- Dynamic Entrance Slide-In Animation --- */
        @keyframes slideInUp {
            0% {
                opacity: 0;
                transform: translateY(28px) scale(0.95);
                filter: blur(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }
        .animate-entrance {
            opacity: 0;
            animation: slideInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.15s; }
        .stagger-3 { animation-delay: 0.25s; }
        .stagger-4 { animation-delay: 0.35s; }
        .stagger-5 { animation-delay: 0.45s; }

        /* Mobile Landscape & Short Viewport Optimization */
        @media (max-height: 520px) {
            body {
                overflow-y: auto;
            }
            .time-display {
                font-size: 2.75rem !important;
            }
            #app-container {
                display: flex !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                gap: 1rem 2rem !important;
                padding: 1rem !important;
                max-width: 95vw;
            }
        }

        /* Ambient Stars Animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.15; transform: scale(0.8); }
            50% { opacity: 0.85; transform: scale(1.2); }
        }
        .star {
            position: absolute;
            background-color: #eae8d9;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite var(--delay, 0s);
        }
        body.dark-mode #star-container {
            opacity: 1;
        }

        /* Soft time-of-day color shifts */
        body.dawn-mode { background-color: #FAF2EB; color: #4E443F; }
        body.dusk-mode { background-color: #F7EFE6; color: #4A423D; }
        body.dark-mode.night-mode { background-color: #141416; color: #eae8d9; }
        body.dark-mode.dusk-mode { background-color: #1c1822; color: #eae8d9; }

        /* Apple Liquid Glass Effect */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow: 
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.7),
                inset 0 -1px 1px 0 rgba(0, 0, 0, 0.05),
                0 20px 40px -15px rgba(0, 0, 0, 0.12);
        }

        body.dark-mode .liquid-glass {
            background: rgba(30, 30, 35, 0.55);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4),
                0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .liquid-glass-subtle {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.6);
        }

        body.dark-mode .liquid-glass-subtle {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(14px) saturate(160%);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 0.5px rgba(255, 255, 255, 0.15);
        }

        .liquid-glass-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.3));
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.85),
                0 4px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .liquid-glass-button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.45));
            transform: translateY(-1px);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.95),
                0 6px 16px rgba(0, 0, 0, 0.12);
        }

        .liquid-glass-button:active {
            transform: translateY(0.5px) scale(0.98);
        }

        body.dark-mode .liquid-glass-button {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.06));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.3),
                0 4px 16px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .liquid-glass-button:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.4),
                0 6px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="w-full flex flex-col items-center justify-center relative">

    <!-- Starry background layer for night (upper half only) -->
    <div id="star-container" class="fixed top-0 left-0 right-0 h-1/2 pointer-events-none opacity-0 transition-opacity duration-1000 z-0"></div>

    <!-- Main Container -->
    <div class="flex flex-col items-center transition-opacity duration-1000 z-10 max-w-full px-4" id="app-container">
        
        <!-- Location Display & Air Quality Indicator -->
        <div class="flex items-center gap-2 mb-2 px-3.5 py-1 rounded-full liquid-glass-subtle animate-entrance stagger-1">
            <div class="text-[0.65rem] sm:text-xs tracking-[0.35em] font-medium opacity-70 uppercase" id="location-display">
                LOCATING...
            </div>
            <div id="aqi-dot" class="w-2 h-2 rounded-full bg-emerald-500 opacity-0 transition-opacity duration-500" title="Air Quality"></div>
        </div>

        <!-- Date & Moon Phase Display -->
        <div class="flex items-center gap-2 text-xs sm:text-sm tracking-[0.3em] font-medium opacity-60 mb-2 sm:mb-4 whitespace-nowrap animate-entrance stagger-2">
            <span id="date-display">-- , -- --</span>
            <span id="moon-phase" class="hidden text-[0.65rem] tracking-widest opacity-80 border-l border-current pl-2"></span>
        </div>

        <!-- Time Display -->
        <div class="time-display flex items-center justify-center whitespace-nowrap animate-entrance stagger-3" id="time">
            -- : --
        </div>

        <!-- Weather Display (Clickable for expanded details with Liquid Glass Pill effect) -->
        <div class="flex items-center gap-6 sm:gap-8 mt-2 sm:mt-5 px-5 sm:px-6 py-2.5 sm:py-3 rounded-3xl liquid-glass-subtle cursor-pointer group hover:scale-[1.03] transition-all duration-300 animate-entrance stagger-4" onclick="toggleWeatherModal()" title="Click for weather details">
            <!-- Dynamic Weather Icon with ambient float -->
            <i class="ph ph-cloud-sun loading transition-all duration-500 animate-float text-3xl sm:text-5xl" id="weather-icon"></i>
            
            <!-- Temperature (Interactive Details / Toggle) -->
            <div class="flex flex-col items-center">
                <div class="flex items-center gap-1 sm:gap-2 group-hover:scale-105 transition-transform">
                    <i class="ph ph-thermometer text-2xl sm:text-5xl"></i>
                    <span id="temperature" class="font-bold tracking-wider loading text-3xl sm:text-5xl">--&deg;</span>
                </div>
                <!-- High & Low Expected -->
                <div id="high-low" class="text-[0.65rem] sm:text-xs font-normal tracking-widest mt-0.5 sm:mt-1 opacity-60 loading">
                    H: --&deg; &nbsp; L: --&deg;
                </div>
            </div>
        </div>
        
        <!-- Seasonal SVG Tree (Resized smaller for mobile screen sizes) -->
        <div class="mt-3 sm:mt-6 flex justify-center opacity-80 animate-entrance stagger-5">
            <svg viewBox="0 0 100 100" class="w-20 h-20 sm:w-28 sm:h-28 overflow-visible">
                <!-- Ground Grass Tufts (Static & Smaller) -->
                <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5">
                    <path d="M43 95 Q41 91 40 89" />
                    <path d="M46 95 Q45 91 44 88" />
                    <path d="M54 95 Q55 91 56 88" />
                    <path d="M57 95 Q58 91 60 89" />
                </g>

                <!-- Swaying Tree Group (Only tree sways) -->
                <g class="animate-sway" style="transform-origin: 50px 95px;">
                    <!-- Trunk and main branches (CurrentColor adapts to Dark Mode) -->
                    <path d="M50 95 L50 45 M50 65 L35 50 M50 55 L65 40" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                    
                    <!-- Leaves Group (Colors change via JS) -->
                    <g id="tree-leaves" class="transition-all duration-1000 ease-in-out origin-bottom" stroke-width="3" stroke="currentColor" fill="none">
                        <circle cx="50" cy="30" r="18" />
                        <circle cx="32" cy="45" r="14" />
                        <circle cx="68" cy="45" r="14" />
                        <circle cx="50" cy="15" r="12" />
                    </g>
                    
                    <!-- Winter Snow and Bare branches (Hidden by default) -->
                    <g id="tree-snow" class="transition-all duration-1000 ease-in-out" opacity="0" fill="currentColor">
                        <!-- Snowflakes -->
                        <circle cx="30" cy="20" r="1.5" />
                        <circle cx="70" cy="25" r="1.5" />
                        <circle cx="50" cy="5" r="1.5" />
                        <circle cx="20" cy="40" r="1.5" />
                        <circle cx="80" cy="55" r="1.5" />
                        <!-- Extra bare branches -->
                        <path d="M35 50 L25 45 M65 40 L75 35 M50 45 L45 35" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
                    </g>
                </g>
            </svg>
        </div>

    </div>

    <!-- Location Status (Subtle) -->
    <div id="status-message" class="absolute bottom-4 text-xs tracking-widest opacity-40 z-10">
        Locating...
    </div>

    <!-- Weather Modal Overlay (Apple Liquid Glass) -->
    <div id="weather-modal" class="fixed inset-0 bg-black/30 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300" onclick="if(event.target === this) toggleWeatherModal()">
        <div id="weather-modal-card" class="liquid-glass rounded-3xl p-6 w-full max-w-xs sm:max-w-sm flex flex-col gap-4 transform scale-95 transition-transform duration-300">
            <!-- Header -->
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold tracking-widest uppercase opacity-70">Weather Details</span>
                <button onclick="toggleWeatherModal()" class="w-7 h-7 rounded-full flex items-center justify-center liquid-glass-button text-sm">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-2 text-center text-xs">
                <div class="liquid-glass-subtle rounded-2xl p-2.5 flex flex-col items-center">
                    <i class="ph ph-wind text-lg opacity-70 mb-1"></i>
                    <span class="text-[0.65rem] opacity-60 uppercase tracking-wider">Wind</span>
                    <span id="modal-wind" class="font-bold mt-0.5">-- mph</span>
                </div>
                <div class="liquid-glass-subtle rounded-2xl p-2.5 flex flex-col items-center">
                    <i class="ph ph-drop text-lg opacity-70 mb-1"></i>
                    <span class="text-[0.65rem] opacity-60 uppercase tracking-wider">Humidity</span>
                    <span id="modal-humidity" class="font-bold mt-0.5">--%</span>
                </div>
                <div class="liquid-glass-subtle rounded-2xl p-2.5 flex flex-col items-center">
                    <i class="ph ph-cloud-rain text-lg opacity-70 mb-1"></i>
                    <span class="text-[0.65rem] opacity-60 uppercase tracking-wider">Precip</span>
                    <span id="modal-precip" class="font-bold mt-0.5">--%</span>
                </div>
            </div>

            <!-- 5-Hour Forecast Strip -->
            <div class="liquid-glass-subtle rounded-2xl p-3 flex flex-col gap-2">
                <span class="text-[0.65rem] font-bold tracking-widest uppercase opacity-60 text-center">5-Hour Trend</span>
                <div id="hourly-forecast" class="flex justify-between items-center px-1 text-xs">
                    <!-- Hourly items rendered dynamically -->
                </div>
            </div>

            <!-- Unit Switcher Button -->
            <button onclick="toggleTemperatureUnit()" class="liquid-glass-button py-2.5 px-4 rounded-2xl text-xs font-semibold tracking-wider flex items-center justify-center gap-2">
                <i class="ph ph-arrows-clockwise text-sm opacity-70"></i>
                <span>Switch to </span>
                <span id="modal-unit-label">Celsius (&deg;C)</span>
            </button>
        </div>
    </div>

    <script>
        // --- Immediate Dark Mode Check ---
        const initialHour = new Date().getHours();
        if (initialHour < 6 || initialHour >= 18) {
            document.body.classList.add('dark-mode');
        }

        // --- Moon Phase Calculation ---
        function getMoonPhase(date = new Date()) {
            let year = date.getFullYear();
            let month = date.getMonth() + 1;
            let day = date.getDate();
            if (month < 3) { year--; month += 12; }
            month++;
            let c = 365.25 * year;
            let e = 30.6 * month;
            let jd = c + e + day - 694039.09;
            jd /= 29.5305882;
            let phase = (jd - Math.floor(jd)) * 29.5305882;
            
            if (phase < 1.84) return "NEW MOON";
            if (phase < 5.53) return "WAXING CRESCENT";
            if (phase < 9.22) return "FIRST QUARTER";
            if (phase < 12.91) return "WAXING GIBBOUS";
            if (phase < 16.61) return "FULL MOON";
            if (phase < 20.30) return "WANING GIBBOUS";
            if (phase < 23.99) return "LAST QUARTER";
            if (phase < 27.68) return "WANING CRESCENT";
            return "NEW MOON";
        }

        function updateMoonPhaseDisplay() {
            const moonEl = document.getElementById('moon-phase');
            if (document.body.classList.contains('dark-mode')) {
                moonEl.innerText = getMoonPhase();
                moonEl.classList.remove('hidden');
            } else {
                moonEl.classList.add('hidden');
            }
        }

        // --- Generate Ambient Stars for Dark Mode ---
        function createStars() {
            const container = document.getElementById('star-container');
            container.innerHTML = '';
            for (let i = 0; i < 35; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 50}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--delay', `${Math.random() * 4}s`);
                star.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
                container.appendChild(star);
            }
        }
        createStars();

        // --- State Variables ---
        let weatherData = { tempF: null, highF: null, lowF: null, windMph: null, humidity: null, precipChance: null, sunrise: null, sunset: null, hourly: [] };
        let isCelsius = false;

        // --- Clock & Date Logic ---
        function updateTimeAndDate() {
            const now = new Date();
            let hours = now.getHours() % 12 || 12; 
            let minutes = now.getMinutes();
            
            const hoursStr = hours.toString().padStart(2, '0');
            const minutesStr = minutes.toString().padStart(2, '0');
            document.getElementById('time').innerText = `${hoursStr.charAt(0)} ${hoursStr.charAt(1)} : ${minutesStr.charAt(0)} ${minutesStr.charAt(1)}`;

            const days = ['S U N', 'M O N', 'T U E', 'W E D', 'T H U', 'F R I', 'S A T'];
            const months = ['J A N', 'F E B', 'M A R', 'A P R', 'M A Y', 'J U N', 'J U L', 'A U G', 'S E P', 'O C T', 'N O V', 'D E C'];
            
            const dayStr = days[now.getDay()];
            const monthStr = months[now.getMonth()];
            const dateNum = now.getDate().toString().split('').join(' ');
            
            document.getElementById('date-display').innerText = `${dayStr} ,  ${monthStr}  ${dateNum}`;
        }

        setInterval(updateTimeAndDate, 1000);
        updateTimeAndDate();

        // --- Interactive Temperature Logic ---
        function fToC(f) { return (f - 32) * 5/9; }

        function toggleTemperatureUnit() {
            if (weatherData.tempF === null) return;
            isCelsius = !isCelsius;
            renderWeather();
        }

        function toggleWeatherModal() {
            const modal = document.getElementById('weather-modal');
            const card = document.getElementById('weather-modal-card');
            const isOpen = modal.classList.contains('opacity-100');

            if (isOpen) {
                modal.classList.remove('opacity-100');
                modal.classList.add('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-100');
                card.classList.add('scale-95');
            } else {
                modal.classList.remove('opacity-0', 'pointer-events-none');
                modal.classList.add('opacity-100');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }
        }

        function renderWeather() {
            const tempEl = document.getElementById('temperature');
            const hlEl = document.getElementById('high-low');

            if (!tempEl || !hlEl) return;

            const t = isCelsius ? fToC(weatherData.tempF) : weatherData.tempF;
            const h = isCelsius ? fToC(weatherData.highF) : weatherData.highF;
            const l = isCelsius ? fToC(weatherData.lowF) : weatherData.lowF;

            tempEl.innerHTML = `${Math.round(t)}&deg;`;
            hlEl.innerHTML = `H: ${Math.round(h)}&deg; &nbsp; L: ${Math.round(l)}&deg;`;
            
            tempEl.classList.remove('loading');
            hlEl.classList.remove('loading');

            // Update modal details & hourly forecast
            if (weatherData.windMph !== null) {
                const windEl = document.getElementById('modal-wind');
                const humEl = document.getElementById('modal-humidity');
                const precipEl = document.getElementById('modal-precip');
                const unitEl = document.getElementById('modal-unit-label');

                if (windEl) windEl.innerText = `${Math.round(weatherData.windMph)} mph`;
                if (humEl) humEl.innerText = `${Math.round(weatherData.humidity)}%`;
                if (precipEl) precipEl.innerText = `${Math.round(weatherData.precipChance)}%`;
                if (unitEl) unitEl.innerHTML = isCelsius ? 'Fahrenheit (&deg;F)' : 'Celsius (&deg;C)';
                
                // Render 5-hour trend
                const hourlyContainer = document.getElementById('hourly-forecast');
                if (hourlyContainer && weatherData.hourly && weatherData.hourly.length >= 5) {
                    const currentHour = new Date().getHours();
                    let html = '';
                    for (let i = 0; i < 5; i++) {
                        const idx = currentHour + i;
                        const item = weatherData.hourly[idx] || weatherData.hourly[i];
                        const hr = (currentHour + i) % 12 || 12;
                        const ampm = (currentHour + i) % 24 >= 12 ? 'PM' : 'AM';
                        const tempVal = isCelsius ? fToC(item.temp) : item.temp;
                        html += `
                            <div class="flex flex-col items-center">
                                <span class="opacity-50 text-[0.6rem]">${hr}${ampm}</span>
                                <span class="font-bold my-0.5">${Math.round(tempVal)}&deg;</span>
                            </div>
                        `;
                    }
                    hourlyContainer.innerHTML = html;
                }
            }
        }

        // --- Seasonal Scene Logic ---
        function updateSeason() {
            const month = new Date().getMonth();
            const leaves = document.getElementById('tree-leaves');
            const snow = document.getElementById('tree-snow');
            
            let season = 'summer';
            if (month === 11 || month <= 1) season = 'winter';
            else if (month >= 2 && month <= 4) season = 'spring';
            else if (month >= 5 && month <= 7) season = 'summer';
            else season = 'autumn';

            if (season === 'winter') {
                leaves.style.opacity = '0';
                snow.style.opacity = '1';
            } else {
                leaves.style.opacity = '1';
                snow.style.opacity = '0';
                if (season === 'spring') leaves.style.color = '#9CB494';
                else if (season === 'summer') leaves.style.color = '#6D8262';
                else if (season === 'autumn') leaves.style.color = '#C18C61';
            }

            return season;
        }

        const currentSeason = updateSeason();

        // --- Weather & Environment Logic ---
        function getWeatherIconClass(wmoCode, isNight) {
            const code = parseInt(wmoCode);
            if (code === 0) return isNight ? 'ph-moon' : 'ph-sun';
            if ([1, 2].includes(code)) return isNight ? 'ph-cloud-moon' : 'ph-cloud-sun';
            if (code === 3) return 'ph-cloud';
            if ([45, 48].includes(code)) return 'ph-cloud-fog';
            if ([51, 53, 55, 56, 57].includes(code)) return 'ph-cloud-drizzle';
            if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return 'ph-cloud-rain';
            if ([71, 73, 75, 77, 85, 86].includes(code)) return 'ph-cloud-snow';
            if ([95, 96, 99].includes(code)) return 'ph-cloud-lightning';
            return isNight ? 'ph-cloud-moon' : 'ph-cloud-sun';
        }

        function updateLighting(sunriseISO, sunsetISO) {
            const now = new Date();
            const sunrise = new Date(sunriseISO);
            const sunset = new Date(sunsetISO);
            
            const isNight = now < sunrise || now > sunset;
            const hour = now.getHours();

            document.body.classList.remove('dawn-mode', 'dusk-mode', 'night-mode');

            if (isNight) {
                document.body.classList.add('dark-mode');
                if (hour >= 20 || hour < 5) document.body.classList.add('night-mode');
                else document.body.classList.add('dusk-mode');
            } else {
                document.body.classList.remove('dark-mode');
                if (hour >= 5 && hour < 8) document.body.classList.add('dawn-mode');
                else if (hour >= 17 && hour <= 19) document.body.classList.add('dusk-mode');
            }
            
            updateMoonPhaseDisplay();
            return isNight;
        }

        async function fetchAirQuality(lat, lon) {
            try {
                const res = await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi`);
                const data = await res.json();
                if (data && data.current && data.current.us_aqi !== undefined) {
                    const aqi = data.current.us_aqi;
                    const dot = document.getElementById('aqi-dot');
                    dot.classList.remove('opacity-0');
                    dot.title = `Air Quality Index: ${aqi}`;

                    if (aqi <= 50) dot.className = 'w-2 h-2 rounded-full bg-emerald-500 opacity-80 transition-opacity duration-500';
                    else if (aqi <= 100) dot.className = 'w-2 h-2 rounded-full bg-amber-400 opacity-80 transition-opacity duration-500';
                    else dot.className = 'w-2 h-2 rounded-full bg-rose-500 opacity-80 transition-opacity duration-500';
                }
            } catch (e) {
                console.warn("Failed to fetch AQI", e);
            }
        }

        async function fetchLocationName(lat, lon) {
            try {
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
                const data = await res.json();
                const city = data.city || data.locality || data.principalSubdivision || "LOCAL WEATHER";
                document.getElementById('location-display').innerText = city.toUpperCase();
            } catch (e) {
                document.getElementById('location-display').innerText = "WEST VALLEY CITY";
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                fetchLocationName(lat, lon);
                fetchAirQuality(lat, lon);

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.current) {
                    weatherData.tempF = data.current.temperature_2m;
                    weatherData.highF = data.daily.temperature_2m_max[0];
                    weatherData.lowF = data.daily.temperature_2m_min[0];
                    weatherData.windMph = data.current.wind_speed_10m;
                    weatherData.humidity = data.current.relative_humidity_2m;
                    weatherData.precipChance = data.hourly.precipitation_probability ? data.hourly.precipitation_probability[new Date().getHours()] || 0 : 0;
                    weatherData.sunrise = data.daily.sunrise[0];
                    weatherData.sunset = data.daily.sunset[0];

                    if (data.hourly && data.hourly.temperature_2m) {
                        weatherData.hourly = data.hourly.temperature_2m.map(t => ({ temp: t }));
                    }

                    renderWeather();

                    // Feature 1: Wind-responsive tree sway speed
                    const swayDuration = Math.max(1.5, Math.min(8, 8 - (weatherData.windMph / 4)));
                    document.documentElement.style.setProperty('--sway-duration', `${swayDuration}s`);

                    const isNight = updateLighting(data.daily.sunrise[0], data.daily.sunset[0]);

                    const weatherCode = data.current.weather_code;
                    const iconEl = document.getElementById('weather-icon');
                    iconEl.className = `ph ${getWeatherIconClass(weatherCode, isNight)} transition-all duration-500 animate-float`;
                    
                    document.getElementById('status-message').innerText = "";
                }
            } catch (error) {
                console.error("Failed to fetch weather:", error);
                document.getElementById('status-message').innerText = "Failed to load weather.";
            }
        }

        // --- Geolocation Logic ---
        function initApp() {
            generateAppIcon();
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        fetchWeather(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        console.warn("Geolocation denied or failed, using default location.");
                        document.getElementById('status-message').innerText = "";
                        fetchWeather(40.6916, -111.9963);
                    },
                    { timeout: 5000 }
                );
            } else {
                fetchWeather(40.6916, -111.9963);
            }
        }

        // --- Generate Home Screen Icon ---
        function generateAppIcon() {
            const svgString = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
                <rect width="100" height="100" fill="#fef6cd"/>
                <path d="M50 95 L50 45 M50 65 L35 50 M50 55 L65 40" stroke="#4a4a45" stroke-width="6" stroke-linecap="round" fill="none"/>
                <g stroke-width="5" stroke="#6d8262" fill="none">
                    <circle cx="50" cy="30" r="18" />
                    <circle cx="32" cy="45" r="14" />
                    <circle cx="68" cy="45" r="14" />
                    <circle cx="50" cy="15" r="12" />
                </g>
            </svg>`;
            
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);
            
            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                const pngDataUrl = canvas.toDataURL('image/png');
                
                let appleLink = document.querySelector('link[rel="apple-touch-icon"]');
                if (!appleLink) {
                    appleLink = document.createElement('link');
                    appleLink.rel = 'apple-touch-icon';
                    document.head.appendChild(appleLink);
                }
                appleLink.href = pngDataUrl;
                
                let favicon = document.querySelector('link[rel="icon"]');
                if (!favicon) {
                    favicon = document.createElement('link');
                    favicon.rel = 'icon';
                    document.head.appendChild(favicon);
                }
                favicon.href = pngDataUrl;
                
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        initApp();
    </script>
</body>
</html>
