<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linger</title>
    
    <link rel="apple-touch-icon" href="apple-touch-icon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            margin: 0;
            overflow: hidden; 
        }
        
        .slide-transition {
            transition: transform 0.3s ease-out, opacity 0.3s ease-in-out;
        }

        .description-card {
            background-color: transparent;
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: none;
            margin-top: 20px; 
            z-index: 10;
            text-align: center;
            color: #1f2937;
            border: none;
        }

        @media (max-width: 768px) {
            .description-card {
                width: 95%;
                margin-top: 10px;
            }
        }

        .slideshow-btn {
            background-color: #ffffff;
            color: #1f2937;
            border-radius: 20px;
            padding: 10px 20px;
            box-shadow: none;
            transition: opacity 0.3s ease-in-out, transform 0.2s ease-in-out;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            z-index: 30;
        }

        .slideshow-btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        body.hide-info .description-card {
            display: none !important;
        }
        
        .art-frame {
            background-color: #fdfbf7;
            padding: 16px; 
            border: 40px solid #c5a059; 
            border-image-source: url('my-frame.png');
            border-image-slice: 60;
            border-image-width: 40px;
            border-image-repeat: stretch;
            box-shadow: 
                inset 0px 0px 10px rgba(0,0,0,0.2), 
                0px 15px 35px rgba(0,0,0,0.3);      
            position: relative;
            overflow: hidden; 
            display: inline-block;
            border-radius: 2px;
        }

        .artwork-image {
            max-height: 60vh;
            width: auto;
            max-width: 100%;
            display: block;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Floating Heart Animation */
        @keyframes heartFadeUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            15% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            70% { opacity: 1; transform: translate(-50%, -70%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -100%) scale(1); }
        }
        
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: heartFadeUp 1s ease-out forwards;
            z-index: 100;
        }

        #favoritesGridContainer {
            overflow-y: auto;
            height: 100vh;
            width: 100vw;
            padding: 100px 20px 40px 20px;
            box-sizing: border-box;
            background: #ffffff;
        }

        .fav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .fav-grid {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }
        
        .fav-grid .art-frame {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .fav-grid .artwork-image {
            max-height: 40vh;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Style Filter Dropdown -->
    <div id="styleFilterContainer" class="absolute top-6 left-6 md:top-10 md:left-10 z-30">
        <div class="relative inline-flex items-center">
            <select id="styleFilter" class="appearance-none bg-transparent border-none text-gray-800 font-['Times_New_Roman'] text-lg md:text-xl outline-none cursor-pointer hover:opacity-70 transition-opacity pr-6 py-1">
                <option value="painting" data-min="0" data-max="2025">All Paintings</option>
                <option value="Impressionism" data-min="1850" data-max="1930">Impressionism</option>
                <option value="Renaissance" data-min="1300" data-max="1650">Renaissance</option>
                <option value="Modernism" data-min="1880" data-max="1980">Modern Art</option>
                <option value="portrait" data-min="0" data-max="2025">Portraits</option>
                <option value="landscape" data-min="0" data-max="2025">Landscapes</option>
                <option value="favorites" data-min="0" data-max="2025">My Collection (Favorites)</option>
            </select>
            <!-- Custom tight arrow -->
            <svg class="w-4 h-4 text-gray-800 absolute right-0 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </div>
    </div>

    <!-- Required Viewing Timer (A11y live region) -->
    <div id="artTimer" aria-live="polite" aria-atomic="true" class="absolute top-6 right-6 md:top-10 md:right-10 z-30 font-['Times_New_Roman'] text-gray-500 text-lg md:text-xl transition-opacity duration-500 opacity-0 pointer-events-none tracking-wide">
        0:30
    </div>

    <!-- Slideshow Button -->
    <select id="slideshowBtn" class="absolute bottom-6 right-6 md:bottom-10 md:right-10 slideshow-btn outline-none cursor-pointer appearance-none text-center px-4 py-2">
        <option value="" disabled selected hidden>Start Slideshow...</option>
        <option value="with-info">With Info Box</option>
        <option value="without-info">Without Info Box</option>
    </select>

    <!-- Left Navigation Arrow -->
    <button id="prevBtn" aria-label="Previous artwork" class="hidden md:block absolute left-4 md:left-10 top-1/2 -translate-y-1/2 p-2 text-gray-300 hover:text-gray-800 transition-all duration-300 z-20 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400">
        <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <!-- Artwork Container (A11y live region) -->
    <div id="artworkWrapper" aria-live="polite" class="absolute max-w-[85vw] md:max-w-[70vw] slide-transition opacity-0 translate-x-0 flex flex-col items-center">
        <div class="art-frame">
            <img src="" alt="Artwork" class="artwork-image" tabindex="0" aria-label="Artwork image. Press Enter to toggle zoom, double click to favorite.">
        </div>
        
        <div class="description-card max-w-[320px] md:max-w-[500px]">
            <div class="desc-content text-sm md:text-base leading-relaxed"></div>
        </div>
    </div>

    <!-- Favorites Grid Container (Hidden by default) -->
    <div id="favoritesGridContainer" class="hidden z-20 absolute top-0 left-0">
        <div class="fav-grid" id="favoritesGrid"></div>
    </div>

    <!-- Right Navigation Arrow -->
    <button id="nextBtn" aria-label="Next artwork" class="hidden md:block absolute right-4 md:left-auto right-4 md:right-10 top-1/2 -translate-y-1/2 p-2 text-gray-300 hover:text-gray-800 transition-all duration-300 z-20 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400">
        <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
        </svg>
    </button>

    <script>
        let artworks = [];
        let currentIndex = 0;
        let isTransitioning = true; 
        let isSlideshowActive = false;
        let slideshowMode = null;
        let savedFavorites = JSON.parse(localStorage.getItem('linger_favorites')) || [];

        // Viewing Timer Variables
        let canNavigate = false;
        let artTimerInterval = null;
        const VIEWING_TIME = 30; 
        const SLIDESHOW_TIME = 120; 

        // DOM Elements
        let currentWrapper = document.getElementById('artworkWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideshowBtn = document.getElementById('slideshowBtn');
        const styleFilterContainer = document.getElementById('styleFilterContainer');
        const styleFilter = document.getElementById('styleFilter');
        const timerEl = document.getElementById('artTimer');
        const favoritesGridContainer = document.getElementById('favoritesGridContainer');
        const favoritesGrid = document.getElementById('favoritesGrid');

        currentWrapper.querySelector('.desc-content').innerHTML = "Fetching masterpieces from the Art Institute of Chicago...";

        // Debounce utility function
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function startTimer() {
            clearInterval(artTimerInterval);
            canNavigate = false;
            
            let isSlideshow = isSlideshowActive;
            let timeLeft = isSlideshow ? SLIDESHOW_TIME : VIEWING_TIME;
            
            timerEl.style.opacity = '1';
            timerEl.style.color = '#6b7280'; 
            
            if (!isSlideshow) {
                prevBtn.style.opacity = '0.2';
                nextBtn.style.opacity = '0.2';
                prevBtn.style.cursor = 'not-allowed';
                nextBtn.style.cursor = 'not-allowed';
            }

            const updateTimerDisplay = () => {
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;
                timerEl.innerHTML = `${m}:${s.toString().padStart(2, '0')}`;
            };
            
            updateTimerDisplay();

            artTimerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    updateTimerDisplay();
                } else {
                    clearInterval(artTimerInterval);
                    canNavigate = true;
                    
                    if (isSlideshowActive) {
                        navigate(1); 
                    } else {
                        timerEl.innerHTML = "You may move on";
                        
                        prevBtn.style.opacity = '1';
                        nextBtn.style.opacity = '1';
                        prevBtn.style.cursor = 'pointer';
                        nextBtn.style.cursor = 'pointer';
                        
                        setTimeout(() => {
                            if (canNavigate && !isSlideshowActive) timerEl.style.opacity = '0';
                        }, 2500);
                    }
                }
            }, 1000);
        }

        async function fetchArtworks(searchQuery = "painting", forceFirstPage = false, minYear = 0, maxYear = 2025) {
            try {
                const maxPage = searchQuery === "painting" ? 10 : 3;
                const page = forceFirstPage ? 1 : Math.floor(Math.random() * maxPage) + 1;
                
                const response = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(searchQuery)}&query[term][is_public_domain]=true&limit=100&page=${page}&fields=id,title,image_id,artist_title,date_display,date_start,thumbnail,medium_display`);
                const data = await response.json();
                
                if (data && data.data) {
                    artworks = data.data.filter(art => {
                        if (!art.image_id) return false;
                        const year = art.date_start;
                        if (minYear > 0 || maxYear < 2025) {
                            if (!year) return false; 
                            if (year < minYear || year > maxYear) return false;
                        }
                        return true;
                    });
                    
                    artworks = artworks.sort(() => Math.random() - 0.5);
                    
                    if (artworks.length > 0) {
                        currentIndex = 0;
                        isTransitioning = false;
                        loadAndDisplayArtwork(currentIndex, 0);
                    } else if (!forceFirstPage) {
                        fetchArtworks(searchQuery, true, minYear, maxYear); 
                    } else {
                        currentWrapper.querySelector('.desc-content').innerHTML = "No artworks found for this category.";
                        currentWrapper.classList.remove('opacity-0');
                        isTransitioning = false; 
                    }
                } else {
                    throw new Error("Invalid data structure returned from API.");
                }
            } catch (error) {
                console.error("Error fetching art:", error);
                currentWrapper.querySelector('.desc-content').innerHTML = "Failed to load artworks. Please select a category to try again.";
                currentWrapper.classList.remove('opacity-0');
                isTransitioning = false; 
            }
        }

        function renderFavoritesGrid() {
            favoritesGrid.innerHTML = '';
            
            if (savedFavorites.length === 0) {
                favoritesGrid.innerHTML = '<div class="col-span-1 md:col-span-2 text-center text-gray-500 font-[\'Times_New_Roman\'] mt-10">Your collection is empty. Double tap an artwork to save it here.</div>';
                return;
            }

            savedFavorites.forEach(art => {
                const itemHtml = `
                    <div class="flex flex-col items-center">
                        <div class="art-frame mb-4">
                            <img src="https://www.artic.edu/iiif/2/${art.image_id}/full/843,/0/default.jpg" alt="${art.title}" class="artwork-image shadow-md" loading="lazy">
                        </div>
                        <div class="text-center font-['Times_New_Roman'] mt-2">
                            <div class="font-bold text-lg text-gray-800">${art.title}</div>
                            <div class="text-sm text-gray-600 uppercase tracking-wider mt-1">${art.artist_title || 'Unknown Artist'}</div>
                            <button onclick="removeFromFavorites(${art.id})" class="text-xs text-red-500 hover:text-red-700 mt-2 uppercase tracking-widest transition-colors cursor-pointer outline-none">Remove</button>
                        </div>
                    </div>
                `;
                favoritesGrid.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        window.removeFromFavorites = function(id) {
            savedFavorites = savedFavorites.filter(a => a.id !== id);
            localStorage.setItem('linger_favorites', JSON.stringify(savedFavorites));
            renderFavoritesGrid();
        };

        const handleFilterChange = debounce((e) => {
            if (isTransitioning) return;
            
            clearInterval(artTimerInterval);
            timerEl.style.opacity = '0';
            canNavigate = true; 
            
            const selectedOption = e.target.options[e.target.selectedIndex];
            const query = selectedOption.value;

            if (query === 'favorites') {
                document.body.style.overflow = 'hidden'; 
                currentWrapper.style.display = 'none';
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
                slideshowBtn.style.display = 'none';
                favoritesGridContainer.classList.remove('hidden');
                renderFavoritesGrid();
                return;
            } else {
                currentWrapper.style.display = 'flex';
                prevBtn.style.display = '';
                nextBtn.style.display = '';
                slideshowBtn.style.display = 'block';
                favoritesGridContainer.classList.add('hidden');
            }

            isTransitioning = true;
            currentWrapper.classList.add('opacity-0'); 
            
            const minYear = parseInt(selectedOption.dataset.min);
            const maxYear = parseInt(selectedOption.dataset.max);

            setTimeout(() => {
                currentWrapper.querySelector('.desc-content').innerHTML = `Curating ${selectedOption.text}...`;
                fetchArtworks(query, false, minYear, maxYear);
            }, 500); 
        }, 500); 

        styleFilter.addEventListener('change', handleFilterChange);

        function loadAndDisplayArtwork(index, direction = 0) {
            isTransitioning = true;
            
            const data = artworks[index];
            const title = data.title || 'Unknown Title';
            const date = data.date_display || 'Unknown Date';
            const artist = data.artist_title || 'Unknown Artist';
            const description = (data.thumbnail && data.thumbnail.alt_text) 
                                ? data.thumbnail.alt_text 
                                : (data.medium_display || '');

            const artworkLink = `https://www.artic.edu/artworks/${data.id}`;

            const formattedDesc = `
                <div class="mb-1 flex items-center justify-center gap-3">
                    <a href="${artworkLink}" target="_blank" class="font-bold text-lg hover:text-gray-500 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400" title="View on Art Institute of Chicago website">${title}</a>
                </div>
                <div class="italic text-gray-600 mb-2">(${date})</div>
                <div class="font-medium text-gray-800 uppercase text-xs tracking-widest mb-3">${artist}</div>
                <div class="w-10 h-[1px] bg-gray-400 mx-auto mb-3"></div>
                <div class="text-sm text-gray-700 leading-relaxed">${description}</div>
            `;
            
            const imageUrl = `https://www.artic.edu/iiif/2/${data.image_id}/full/843,/0/default.jpg`;
            
            if (direction === 0) {
                const artworkImage = currentWrapper.querySelector('img');
                const artworkDesc = currentWrapper.querySelector('.desc-content');
                artworkDesc.innerHTML = formattedDesc;
                
                artworkImage.onload = () => {
                    currentWrapper.classList.remove('opacity-0');
                    attachZoom(artworkImage, data.id);
                    isTransitioning = false;
                    startTimer(); 
                };

                artworkImage.onerror = () => {
                    artworkDesc.innerHTML = "Error loading high-res image. Skipping to next...";
                    currentWrapper.classList.remove('opacity-0');
                    isTransitioning = false; 
                    canNavigate = true; 
                    setTimeout(() => navigate(1), 1500);
                };

                artworkImage.src = imageUrl;
                return;
            }

            const newWrapper = currentWrapper.cloneNode(true);
            const startClass = direction === 1 ? 'translate-x-[150vw]' : '-translate-x-[150vw]';
            
            newWrapper.className = `absolute max-w-[85vw] md:max-w-[70vw] flex flex-col items-center slide-transition opacity-100 ${startClass}`;
            newWrapper.setAttribute('aria-live', 'polite');
            
            const newImage = newWrapper.querySelector('img');
            newImage.setAttribute('tabindex', '0');
            const newDesc = newWrapper.querySelector('.desc-content');
            newDesc.innerHTML = formattedDesc;

            document.body.appendChild(newWrapper);
            
            newImage.onload = () => {
                attachZoom(newImage, data.id);
                void newWrapper.offsetWidth;
                
                const exitClass = direction === 1 ? '-translate-x-[150vw]' : 'translate-x-[150vw]';
                
                currentWrapper.classList.remove('translate-x-0');
                currentWrapper.classList.add(exitClass);
                
                newWrapper.classList.remove(startClass);
                newWrapper.classList.add('translate-x-0');
                
                setTimeout(() => {
                    currentWrapper.remove();
                    currentWrapper = newWrapper;
                    isTransitioning = false;
                    startTimer(); 
                }, 300);
            };

            newImage.onerror = () => {
                newWrapper.remove();
                isTransitioning = false; 
                canNavigate = true; 
                setTimeout(() => navigate(direction), 1500);
            };

            newImage.src = imageUrl;
        }

        function navigate(direction) {
            if (isTransitioning || artworks.length === 0 || styleFilter.value === 'favorites') return;
            
            if (!canNavigate) {
                timerEl.style.color = '#ef4444'; 
                setTimeout(() => {
                    if (!canNavigate) timerEl.style.color = '#6b7280';
                }, 300);
                return;
            }
            
            currentIndex += direction;
            
            if (currentIndex < 0) {
                currentIndex = artworks.length - 1;
                loadAndDisplayArtwork(currentIndex, direction);
                return;
            }
            
            if (currentIndex >= artworks.length) {
                isTransitioning = true; 
                canNavigate = true;
                clearInterval(artTimerInterval);
                timerEl.style.opacity = '0';
                currentWrapper.querySelector('.desc-content').innerHTML = "Fetching a new gallery wall...";
                
                const selectedOption = styleFilter.options[styleFilter.selectedIndex];
                fetchArtworks(
                    selectedOption.value, 
                    false, 
                    parseInt(selectedOption.dataset.min), 
                    parseInt(selectedOption.dataset.max)
                ); 
                return;
            }
            
            loadAndDisplayArtwork(currentIndex, direction);
        }

        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        function triggerFavoriteAnimation(e, img, artId, isTouch) {
            const artData = artworks.find(a => a.id === artId);
            if (artData && !savedFavorites.some(a => a.id === artId)) {
                savedFavorites.push(artData);
                localStorage.setItem('linger_favorites', JSON.stringify(savedFavorites));
            }

            const rect = img.getBoundingClientRect();
            let x, y;
            if (isTouch && e.changedTouches && e.changedTouches.length > 0) {
                const touch = e.changedTouches[0];
                x = touch.clientX - rect.left;
                y = touch.clientY - rect.top;
            } else {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            }

            const heart = document.createElement('div');
            heart.innerHTML = '<svg class="w-20 h-20 drop-shadow-lg" fill="#ef4444" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
            heart.className = 'floating-heart';
            heart.style.left = `${x}px`;
            heart.style.top = `${y}px`;
            
            img.parentElement.appendChild(heart);
            setTimeout(() => heart.remove(), 1000);
        }

        function attachZoom(imgElement, artId) {
            imgElement.style.transition = "transform 0.4s ease-out";
            imgElement.style.cursor = "zoom-in";
            imgElement.style.position = "relative";
            
            let isZoomed = false;
            let tapCount = 0;
            let tapTimeout;

            // Desktop Double Click
            imgElement.addEventListener('dblclick', function(e) {
                triggerFavoriteAnimation(e, this, artId, false);
            });

            // A11y Keyboard Zoom Trigger
            imgElement.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (isZoomed) {
                        resetZoom(this);
                        isZoomed = false;
                    } else {
                        this.style.transformOrigin = `center center`;
                        this.style.transform = "scale(2.5)"; 
                        this.style.zIndex = "50";
                        isZoomed = true;
                    }
                }
            });

            imgElement.addEventListener("mousemove", function(e) {
                const x = (e.offsetX / this.offsetWidth) * 100;
                const y = (e.offsetY / this.offsetHeight) * 100;
                
                this.style.transformOrigin = `${x}% ${y}%`;
                this.style.transform = "scale(2.5)"; 
                this.style.zIndex = "50"; 
                isZoomed = true;
            });

            imgElement.addEventListener("mouseleave", function() {
                resetZoom(this);
                isZoomed = false;
            });

            // Mobile specific tap and zoom detection
            imgElement.addEventListener("touchstart", function(e) {
                tapCount++;
                if (tapCount === 1) {
                    tapTimeout = setTimeout(() => {
                        tapCount = 0;
                    }, 400);
                } else if (tapCount === 2) {
                    clearTimeout(tapTimeout);
                    tapCount = 0;
                    triggerFavoriteAnimation(e, this, artId, true);
                    e.preventDefault(); // Prevents jumpy zoom on double tap
                }
                
                e.stopPropagation(); 
                handleTouchZoom(e, this);
                isZoomed = true;
            }, { passive: false });

            imgElement.addEventListener("touchmove", function(e) {
                e.stopPropagation(); 
                handleTouchZoom(e, this);
            }, { passive: true });

            imgElement.addEventListener("touchend", function(e) {
                e.stopPropagation(); 
                resetZoom(this);
                isZoomed = false;
            }, { passive: true });

            function handleTouchZoom(e, img) {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const rect = img.getBoundingClientRect();
                    
                    let x = ((touch.clientX - rect.left) / rect.width) * 100;
                    let y = ((touch.clientY - rect.top) / rect.height) * 100;
                    
                    x = Math.max(0, Math.min(100, x));
                    y = Math.max(0, Math.min(100, y));

                    img.style.transformOrigin = `${x}% ${y}%`;
                    img.style.transform = "scale(2.5)"; 
                    img.style.zIndex = "50";
                }
            }

            function resetZoom(img) {
                img.style.transform = "scale(1)";
                img.style.zIndex = "1";
                
                setTimeout(() => {
                    if (img.style.transform === "scale(1)") {
                        img.style.transformOrigin = "center center";
                    }
                }, 400); 
            }
        }

        function startSlideshow(mode) {
            isSlideshowActive = true;
            slideshowMode = mode;
            
            slideshowBtn.style.display = 'none';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            styleFilterContainer.style.display = 'none';
            
            if (mode === 'without-info') {
                document.body.classList.add('hide-info');
            }
            
            startTimer();
        }

        function stopSlideshow() {
            if (!isSlideshowActive) return;
            isSlideshowActive = false;
            slideshowMode = null;
            
            slideshowBtn.style.display = 'block';
            slideshowBtn.value = ""; 
            
            prevBtn.style.display = '';
            nextBtn.style.display = '';
            
            styleFilterContainer.style.display = 'block';
            document.body.classList.remove('hide-info');
            
            clearInterval(artTimerInterval);
            canNavigate = true;
            timerEl.style.opacity = '0';
            prevBtn.style.opacity = '1';
            nextBtn.style.opacity = '1';
            prevBtn.style.cursor = 'pointer';
            nextBtn.style.cursor = 'pointer';
        }

        slideshowBtn.addEventListener('change', (e) => {
            if (e.target.value) {
                startSlideshow(e.target.value);
            }
        });

        window.addEventListener('keydown', (e) => {
            if (styleFilter.value === 'favorites') return;
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
            if (e.code === 'Space') {
                if (isSlideshowActive) {
                    e.preventDefault(); 
                    stopSlideshow();
                }
            }
        });

        let touchStartX = 0;
        let touchEndX = 0;
        
        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (styleFilter.value === 'favorites') return;
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 15; 
            if (touchEndX < touchStartX - swipeThreshold) {
                if (canNavigate && isSlideshowActive) stopSlideshow();
                navigate(1); 
            } else if (touchEndX > touchStartX + swipeThreshold) {
                if (canNavigate && isSlideshowActive) stopSlideshow();
                navigate(-1); 
            }
        }

        document.body.addEventListener('click', (e) => {
            if (isSlideshowActive && e.target.id !== 'slideshowBtn') {
                stopSlideshow();
            }
        });

        const initialOption = styleFilter.options[styleFilter.selectedIndex];
        fetchArtworks(
            initialOption.value, 
            false, 
            parseInt(initialOption.dataset.min), 
            parseInt(initialOption.dataset.max)
        );
    </script>
</body>
</html>
