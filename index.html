<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F9F8F1">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1a18">

    <title>Widget Dashboard Fixed</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    
    <!-- Polyfill for Mobile HTML5 Drag and Drop -->
    <link rel="stylesheet" href="https://unpkg.com/mobile-drag-drop@3.0.0-rc.0/default.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://unpkg.com/mobile-drag-drop@3.0.0-rc.0/index.min.js"></script>

    <style>
        html { height: -webkit-fill-available; }
        
        body {
            background-color: #F9F8F1;
            color: #4A4A45;
            font-family: 'Varela Round', ui-rounded, sans-serif;
            margin: 0;
            overflow-x: hidden;
            user-select: none;
            overscroll-behavior: none;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            transition: background-color 1s ease, color 1s ease;
        }

        body.dark-mode {
            background-color: #1a1a18;
            color: #eae8d9;
        }

        /* Grid System - Fixed Gaps with dense flow */
        #widget-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            grid-auto-flow: dense;
            gap: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Widget Containers */
        .widget-card {
            background: transparent;
            border-radius: 1.5rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: none;
            transition: opacity 0.3s, transform 0.2s;
        }

        /* Prevent browser from dragging inner elements (like SVGs or Text) by mistake */
        .widget-card * {
            -webkit-user-drag: none;
        }

        body.dark-mode .widget-card {
            background: transparent;
            box-shadow: none;
        }

        /* Widget Sizes */
        .size-small { grid-column: span 1; grid-row: span 1; aspect-ratio: 1 / 1; }
        .size-medium { grid-column: span 2; grid-row: span 1; aspect-ratio: 2 / 1; }
        .size-large { grid-column: span 2; grid-row: span 2; aspect-ratio: 1 / 1; }

        @media (max-width: 400px) {
            .size-medium, .size-large { grid-column: span 1; aspect-ratio: 1/1; }
        }

        body.editing .widget-card {
            background: rgba(0, 0, 0, 0.05);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
            cursor: grab;
            -webkit-user-drag: element;
            touch-action: none;
        }
        body.dark-mode.editing .widget-card {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        body.editing .widget-card:active {
            cursor: grabbing;
        }

        /* Delete Button (Only visible in edit mode) */
        .delete-btn {
            position: absolute;
            top: -10px;
            left: -10px;
            background: rgba(150, 150, 150, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .resize-btn {
            position: absolute;
            bottom: -10px;
            right: -10px;
            background: rgba(150, 150, 150, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        body.editing .delete-btn, body.editing .resize-btn {
            display: flex;
        }
        
        /* Fly-in Animation */
        @keyframes flyInFromBottom {
            0% { transform: translateY(40vh) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }
        .fly-in {
            animation: flyInFromBottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
        }

        /* Bottom Sheet Carousel */
        #carousel-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(249, 248, 241, 0.9);
            backdrop-filter: blur(15px);
            border-top-left-radius: 2rem;
            border-top-right-radius: 2rem;
            padding: 2rem 1rem env(safe-area-inset-bottom) 1rem;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        body.dark-mode #carousel-modal {
            background: rgba(26, 26, 24, 0.9);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        #carousel-modal.open {
            transform: translateY(0);
        }

        .carousel-track {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            scroll-snap-type: x mandatory;
        }
        .carousel-item {
            flex: 0 0 120px;
            scroll-snap-align: start;
            cursor: pointer;
        }

        /* UI Overlays */
        #edit-controls {
            position: fixed;
            top: env(safe-area-inset-top);
            left: 0;
            width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s;
        }
        body.editing #edit-controls {
            opacity: 1;
        }
        
        body.editing #edit-controls .btn-ui {
            pointer-events: auto;
        }

        .btn-ui {
            background: rgba(120, 120, 120, 0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .time-text { font-size: 3.5rem; letter-spacing: 0.1em; line-height: 1; }
        .date-text { font-size: 0.8rem; letter-spacing: 0.2em; text-align: center; }
        
        .loading { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
        .animate-sway { animation: sway 5s ease-in-out infinite; transform-origin: bottom center; }

    </style>
</head>
<body>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-red-500/90 backdrop-blur-md text-[#F9F8F1] px-6 py-3 rounded-full opacity-0 pointer-events-none transition-opacity duration-300 z-50 font-bold tracking-widest text-sm shadow-xl">
        GRID IS FULL
    </div>

    <!-- Global Instructions / Empty State -->
    <div id="empty-state" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40 transition-opacity">
        <p class="tracking-widest text-sm">HOLD TO EDIT</p>
    </div>

    <!-- Edit Mode Controls -->
    <div id="edit-controls">
        <div class="btn-ui flex items-center justify-center text-xl w-10 h-10 p-0 rounded-full" onclick="toggleCarousel()">+</div>
        <div class="btn-ui" onclick="exitEditMode()">Done</div>
    </div>

    <!-- The Grid where widgets live -->
    <div id="widget-grid" ondragenter="dragEnter(event)" ondragover="dragOver(event)" ondrop="gridDrop(event)"></div>

    <!-- Carousel Modal -->
    <div id="carousel-modal">
        <div class="flex justify-between items-center mb-4 px-2">
            <h3 class="font-bold tracking-widest text-sm">ADD WIDGET</h3>
            <i class="ph ph-x text-xl cursor-pointer" onclick="toggleCarousel()"></i>
        </div>
        <div class="carousel-track">
            <!-- Carousel items generated by JS -->
        </div>
    </div>

    <script>
        // Initialize Polyfill for mobile drag-and-drop
        MobileDragDrop.polyfill({
            dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });
        // Required for iOS mobile-drag-drop scrolling behavior
        window.addEventListener('touchmove', function() {}, {passive: false});

        // --- State Management ---
        let widgets = [];
        try {
            // Fixed: Safe local storage parsing
            const stored = localStorage.getItem('my_widgets');
            widgets = stored ? JSON.parse(stored) : [];
            if (!Array.isArray(widgets)) widgets = [];
        } catch(e) {
            widgets = [];
            console.error("Failed to parse widgets, resetting to empty array.");
        }
        
        let isEditing = false;
        let isCelsius = false;

        // Global Data Stores
        let globalTime = "";
        let globalDate = "";
        let globalWeatherData = null;
        let isNight = false;

        // --- Available Widget Types ---
        const sizeClasses = { 'small': 'size-small', 'medium': 'size-medium', 'large': 'size-large' };
        
        function getCardProps(id, size, index) {
            return `class="widget-card ${sizeClasses[size || 'small']}" id="widget-${id}" 
                    draggable="true" ondragstart="dragStart(event, '${id}')" 
                    ondragenter="dragEnter(event)" ondragover="dragOver(event)" 
                    ondrop="drop(event, '${id}')" ondragend="dragEnd(event)"`;
        }
        
        const widgetLibrary = {
            'time': {
                name: 'Time',
                icon: 'ph-clock',
                render: (id, size, index) => `
                    <div ${getCardProps(id, size, index)}>
                        <div class="delete-btn" onclick="removeWidget('${id}', event)"><i class="ph ph-x"></i></div>
                        <div class="resize-btn" onclick="resizeWidget('${id}', event)"><i class="ph ph-corners-out"></i></div>
                        <div class="time-text global-time-sync pointer-events-none">--:--</div>
                    </div>
                `
            },
            'date': {
                name: 'Date',
                icon: 'ph-calendar-blank',
                render: (id, size, index) => `
                    <div ${getCardProps(id, size, index)}>
                        <div class="delete-btn" onclick="removeWidget('${id}', event)"><i class="ph ph-x"></i></div>
                        <div class="resize-btn" onclick="resizeWidget('${id}', event)"><i class="ph ph-corners-out"></i></div>
                        <div class="date-text global-date-sync pointer-events-none">--, -- --</div>
                    </div>
                `
            },
            'weather': {
                name: 'Weather',
                icon: 'ph-cloud-sun',
                render: (id, size, index) => `
                    <div ${getCardProps(id, size, index)} onclick="toggleTempUnit()">
                        <div class="delete-btn" onclick="removeWidget('${id}', event)"><i class="ph ph-x"></i></div>
                        <div class="resize-btn" onclick="resizeWidget('${id}', event)"><i class="ph ph-corners-out"></i></div>
                        <div class="flex flex-col items-center pointer-events-none">
                            <i class="ph ph-thermometer text-3xl mb-1 global-weather-icon-sync"></i>
                            <span class="font-bold text-2xl tracking-wider global-temp-sync loading">--&deg;</span>
                            <div class="text-[0.6rem] font-normal tracking-widest mt-1 opacity-60 global-hl-sync">
                                H:--&deg; L:--&deg;
                            </div>
                        </div>
                    </div>
                `
            },
            'tree': {
                name: 'Season Tree',
                icon: 'ph-tree',
                render: (id, size, index) => `
                    <div ${getCardProps(id, size, index)}>
                        <div class="delete-btn" onclick="removeWidget('${id}', event)"><i class="ph ph-x"></i></div>
                        <div class="resize-btn" onclick="resizeWidget('${id}', event)"><i class="ph ph-corners-out"></i></div>
                        <div class="opacity-80 animate-sway pointer-events-none">
                            <svg width="80" height="80" viewBox="0 0 100 100" class="overflow-visible">
                                <path d="M50 95 L50 45 M50 65 L35 50 M50 55 L65 40" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
                                <g class="tree-leaves-sync" stroke-width="5" stroke="currentColor" fill="none" class="transition-colors duration-1000">
                                    <circle cx="50" cy="30" r="16" />
                                    <circle cx="32" cy="45" r="14" />
                                    <circle cx="68" cy="45" r="14" />
                                    <circle cx="50" cy="15" r="12" />
                                </g>
                                <g class="tree-snow-sync" class="transition-opacity duration-1000" style="opacity: 0;">
                                    <path d="M35 50 L25 45 M65 40 L75 35 M50 45 L45 35" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
                                    <circle cx="28" cy="20" r="2" fill="currentColor" />
                                    <circle cx="72" cy="24" r="2" fill="currentColor" />
                                    <circle cx="50" cy="8" r="2" fill="currentColor" />
                                    <circle cx="22" cy="38" r="2" fill="currentColor" />
                                    <circle cx="78" cy="38" r="2" fill="currentColor" />
                                </g>
                            </svg>
                        </div>
                    </div>
                `
            }
        };

        // --- Core Application Logic ---
        
        let justAddedId = null;
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2500);
        }

        function getUsedSlots() {
            let total = 0;
            widgets.forEach(w => {
                const s = w.size || (w.type === 'time' ? 'medium' : 'small');
                if (s === 'medium') total += 2;
                else if (s === 'large') total += 4;
                else total += 1;
            });
            return total;
        }

        function renderGrid() {
            const grid = document.getElementById('widget-grid');
            const emptyState = document.getElementById('empty-state');
            
            emptyState.style.opacity = widgets.length === 0 ? '0.4' : '0';

            // Fixed: Use DOM diffing instead of innerHTML wipe to preserve animations & state
            
            // 1. Remove deleted nodes
            Array.from(grid.children).forEach(child => {
                const childId = child.id.replace('widget-', '');
                if (!widgets.find(w => w.id === childId)) {
                    grid.removeChild(child);
                }
            });

            // 2. Add or reorder nodes
            widgets.forEach((widget, index) => {
                const template = widgetLibrary[widget.type];
                if (!template) return;
                
                const size = widget.size || (widget.type === 'time' ? 'medium' : 'small');
                let el = document.getElementById('widget-' + widget.id);

                if (!el) {
                    // Create new node if it doesn't exist
                    const temp = document.createElement('div');
                    temp.innerHTML = template.render(widget.id, size, index).trim();
                    el = temp.firstChild;
                    grid.appendChild(el);
                    
                    // Handle fly-in
                    if (justAddedId === widget.id) {
                        el.classList.add('fly-in');
                        setTimeout(() => el.classList.remove('fly-in'), 600);
                    }
                } else {
                    // Update existing node properties
                    el.className = `widget-card ${sizeClasses[size]}`;
                    el.setAttribute('ondragstart', `dragStart(event, '${widget.id}')`);
                    el.setAttribute('ondrop', `drop(event, '${widget.id}')`);
                    
                    // Re-append to maintain array order in the DOM
                    grid.appendChild(el); 
                }
            });
            
            justAddedId = null;

            // Immediately hydrate new widgets
            updateTimeDOM();
            updateWeatherDOM();
            updateTreeDOM();
        }

        function addWidget(type) {
            const defaultSize = type === 'time' ? 'medium' : 'small';
            const cost = defaultSize === 'medium' ? 2 : 1;
            
            if (getUsedSlots() + cost > 13) {
                showToast("NOT ENOUGH SPACE");
                return;
            }

            // Fixed: Stronger unique IDs prevent rapid tap collisions
            const newId = Date.now().toString() + Math.random().toString(36).substr(2, 5); 
            widgets.push({ id: newId, type: type, size: defaultSize });
            justAddedId = newId;
            saveWidgets();
            renderGrid();
        }
        
        function resizeWidget(id, event) {
            if(event) event.stopPropagation();
            const widget = widgets.find(w => w.id === id);
            if(widget) {
                const currentSize = widget.size || (widget.type === 'time' ? 'medium' : 'small');
                const nextSize = { 'small': 'medium', 'medium': 'large', 'large': 'small' };
                let targetSize = nextSize[currentSize];
                
                const currentCost = currentSize === 'large' ? 4 : (currentSize === 'medium' ? 2 : 1);
                const nextCost = targetSize === 'large' ? 4 : (targetSize === 'medium' ? 2 : 1);
                
                if (getUsedSlots() - currentCost + nextCost > 13) {
                    if (targetSize === 'large') {
                        targetSize = 'small'; // Skip large and fallback to small (cost 1)
                    } else {
                        showToast("NOT ENOUGH SPACE TO RESIZE");
                        return;
                    }
                }
                
                widget.size = targetSize;
                saveWidgets();
                renderGrid();
            }
        }

        // Drag and Drop Logic
        function dragStart(e, id) {
            if (!isEditing) { e.preventDefault(); return; }
            document.body.classList.add('dragging-active'); 
            e.dataTransfer.setData('text/plain', String(id));
            e.dataTransfer.effectAllowed = 'move';
            
            // Explicitly tell the browser to drag the whole card, centered on the mouse
            if (e.dataTransfer.setDragImage) {
                e.dataTransfer.setDragImage(e.target, e.target.clientWidth / 2, e.target.clientHeight / 2);
            }
            
            // Fix: Delay opacity change so Windows Chrome generates the drag image properly
            requestAnimationFrame(() => {
                const el = document.getElementById('widget-' + id);
                // Lower opacity to near-zero so it feels like you "picked it up" from the grid
                if (el) el.style.opacity = '0.01';
            });
        }
        
        function dragEnter(e) {
            if (!isEditing) return;
            e.preventDefault(); // REQUIRED by HTML5 spec to allow dropping
        }
        
        function dragOver(e) {
            if (!isEditing) return;
            e.preventDefault(); // REQUIRED by HTML5 spec to allow dropping
            e.dataTransfer.dropEffect = 'move';
        }
        
        function drop(e, targetId) {
            if (!isEditing) return;
            e.preventDefault();
            e.stopPropagation();
            
            const sourceId = e.dataTransfer.getData('text/plain');
            if (sourceId === targetId || !sourceId) return;
            
            const sourceIndex = widgets.findIndex(w => w.id === sourceId);
            const targetIndex = widgets.findIndex(w => w.id === targetId);
            
            if (sourceIndex === -1 || targetIndex === -1) return;
            
            // Reorder array
            const draggedWidget = widgets.splice(sourceIndex, 1)[0];
            widgets.splice(targetIndex, 0, draggedWidget);
            
            saveWidgets();
            renderGrid();
        }
        
        function gridDrop(e) {
            if (!isEditing) return;
            e.preventDefault();
            
            // Only process if dropped directly on the grid gap (not on a widget card)
            if (e.target.id === 'widget-grid') {
                const sourceId = e.dataTransfer.getData('text/plain');
                if (!sourceId) return;
                
                const sourceIndex = widgets.findIndex(w => w.id === sourceId);
                if (sourceIndex === -1) return;
                
                // Move widget to the very end of the grid
                const draggedWidget = widgets.splice(sourceIndex, 1)[0];
                widgets.push(draggedWidget);
                
                saveWidgets();
                renderGrid();
            }
        }
        
        function dragEnd(e) {
            document.body.classList.remove('dragging-active');
            // Fix: Globally reset opacity in case target lost focus
            document.querySelectorAll('.widget-card').forEach(el => el.style.opacity = '1');
        }

        function removeWidget(id, event) {
            if(event) event.stopPropagation();
            // Convert both to strings in case older saved widgets had integer IDs
            widgets = widgets.filter(w => String(w.id) !== String(id));
            saveWidgets();
            renderGrid();
        }

        function saveWidgets() {
            localStorage.setItem('my_widgets', JSON.stringify(widgets));
        }

        // --- Edit Mode (Long Press Logic) ---
        let pressTimer;
        
        function startPress(e) {
            if (isEditing) return;
            if (e.target.closest('.btn-ui') || e.target.closest('#carousel-modal')) return;
            pressTimer = setTimeout(enterEditMode, 600);
        }

        function cancelPress() {
            clearTimeout(pressTimer);
        }

        function enterEditMode() {
            if ('vibrate' in navigator) navigator.vibrate(50);
            isEditing = true;
            document.body.classList.add('editing');
        }

        function exitEditMode() {
            isEditing = false;
            document.body.classList.remove('editing');
            const modal = document.getElementById('carousel-modal');
            if (modal.classList.contains('open')) toggleCarousel();
        }

        window.addEventListener('mousedown', startPress);
        window.addEventListener('mouseup', cancelPress);
        window.addEventListener('mouseleave', cancelPress);
        window.addEventListener('touchstart', startPress, {passive: true});
        window.addEventListener('touchend', cancelPress);
        window.addEventListener('touchcancel', cancelPress);

        // --- Carousel Logic ---
        function populateCarousel() {
            const track = document.querySelector('.carousel-track');
            track.innerHTML = '';
            
            Object.keys(widgetLibrary).forEach(key => {
                const widget = widgetLibrary[key];
                track.innerHTML += `
                    <div class="carousel-item flex flex-col items-center p-4 rounded-2xl bg-black/5 dark:bg-white/5" onclick="addWidget('${key}')">
                        <i class="ph ${widget.icon} text-4xl mb-2 opacity-80"></i>
                        <span class="text-xs tracking-widest font-bold opacity-70">${widget.name}</span>
                    </div>
                `;
            });
        }

        function toggleCarousel() {
            document.getElementById('carousel-modal').classList.toggle('open');
        }

        // --- Global Data Systems ---

        function runTimeSystem() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours % 12 || 12; 
            const hoursStr = hours.toString().padStart(2, '0');
            const minutesStr = minutes.toString().padStart(2, '0');
            
            globalTime = `${hoursStr.charAt(0)} ${hoursStr.charAt(1)} : ${minutesStr.charAt(0)} ${minutesStr.charAt(1)}`;
            
            const days = ['S U N', 'M O N', 'T U E', 'W E D', 'T H U', 'F R I', 'S A T'];
            const months = ['J A N', 'F E B', 'M A R', 'A P R', 'M A Y', 'J U N', 'J U L', 'A U G', 'S E P', 'O C T', 'N O V', 'D E C'];
            globalDate = `${days[now.getDay()]} ,  ${months[now.getMonth()]}  ${now.getDate().toString().split('').join(' ')}`;

            updateTimeDOM();
        }

        function updateTimeDOM() {
            document.querySelectorAll('.global-time-sync').forEach(el => el.innerHTML = globalTime);
            document.querySelectorAll('.global-date-sync').forEach(el => el.innerHTML = globalDate);
        }

        setInterval(runTimeSystem, 1000);
        runTimeSystem();

        function fToC(f) { return (f - 32) * 5/9; }

        function toggleTempUnit() {
            if (isEditing) return;
            isCelsius = !isCelsius;
            updateWeatherDOM();
        }

        async function fetchWeather() {
            let lat = 40.7091, lon = -112.0983;
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
                const response = await fetch(url);
                globalWeatherData = await response.json();

                const now = new Date();
                const sunrise = new Date(globalWeatherData.daily.sunrise[0]);
                const sunset = new Date(globalWeatherData.daily.sunset[0]);
                isNight = now < sunrise || now > sunset;
                
                if (isNight) document.body.classList.add('dark-mode');
                else document.body.classList.remove('dark-mode');

                updateWeatherDOM();
            } catch(e) {
                console.error("Weather failed", e);
            }
        }

        function updateWeatherDOM() {
            if (!globalWeatherData) return;
            
            const data = globalWeatherData;
            const tF = data.current_weather.temperature;
            const hF = data.daily.temperature_2m_max[0];
            const lF = data.daily.temperature_2m_min[0];

            const t = isCelsius ? fToC(tF) : tF;
            const h = isCelsius ? fToC(hF) : hF;
            const l = isCelsius ? fToC(lF) : lF;
            
            const code = data.current_weather.weathercode;
            let icon = 'ph-cloud-sun';
            
            if (code === 0) icon = isNight ? 'ph-moon' : 'ph-sun';
            else if ([1, 2].includes(code)) icon = isNight ? 'ph-cloud-moon' : 'ph-cloud-sun';
            else if ([61, 63, 65].includes(code)) icon = 'ph-cloud-rain';
            else if ([71, 73, 75].includes(code)) icon = 'ph-cloud-snow';
            else icon = 'ph-cloud';

            document.querySelectorAll('.global-temp-sync').forEach(el => {
                el.innerHTML = `${Math.round(t)}&deg;`;
                el.classList.remove('loading');
            });
            document.querySelectorAll('.global-hl-sync').forEach(el => {
                el.innerHTML = `H:${Math.round(h)}&deg; &nbsp; L:${Math.round(l)}&deg;`;
            });
            document.querySelectorAll('.global-weather-icon-sync').forEach(el => {
                el.className = `ph ${icon} text-4xl mb-1 global-weather-icon-sync transition-all`;
            });
        }

        function updateTreeDOM() {
            const month = new Date().getMonth();
            let season = 'autumn';
            if (month === 11 || month <= 1) season = 'winter';
            else if (month >= 2 && month <= 4) season = 'spring';
            else if (month >= 5 && month <= 7) season = 'summer';
            
            document.querySelectorAll('.tree-leaves-sync').forEach(leaves => {
                leaves.style.opacity = season === 'winter' ? '0' : '1';
                if (season === 'spring') leaves.style.color = '#9CB494';
                else if (season === 'summer') leaves.style.color = '#6D8262';
                else if (season === 'autumn') leaves.style.color = '#C18C61';
            });
            
            document.querySelectorAll('.tree-snow-sync').forEach(snow => {
                snow.style.opacity = season === 'winter' ? '1' : '0';
            });
        }

        function initApp() {
            // Fixed: Use system preference as the immediate fallback before weather loads to stop theme flashing
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-mode');
            }
            
            populateCarousel();
            renderGrid();
            fetchWeather();
        }

        initApp();
    </script>
</body>
</html>
