<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artwork Showcase</title>
    
    <!-- Apple Web App Icon -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #ffffff;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars from overlapping cards */
        }
        
        .slide-transition {
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease-in-out;
        }

        .description-card {
            background-color: #E8E3D7;
            border-radius: 20px;
            padding: 16px 24px;
            box-shadow: none;
            margin-top: 20px; 
            z-index: 10;
            text-align: center;
            color: #1f2937;
            border: 1px solid #d8d3c7; /* Subtle definition for the flat card */
        }

        /* Responsive adjustments for the card */
        @media (max-width: 768px) {
            .description-card {
                width: 95%;
                margin-top: 10px;
            }
        }

        .slideshow-btn {
            background-color: #ffffff;
            color: #1f2937;
            border-radius: 20px;
            padding: 10px 20px;
            box-shadow: none;
            transition: opacity 0.3s ease-in-out, transform 0.2s ease-in-out;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            z-index: 30;
        }

        .slideshow-btn:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        /* Hides the description box dynamically during the slideshow if selected */
        body.hide-info .description-card {
            display: none !important;
        }
        
        /* NEW: Frame & Image Styling */
        .art-frame {
            /* The "Matting" (off-white border around the painting) */
            background-color: #fdfbf7;
            padding: 16px; 

            /* CUSTOM IMAGE FRAME */
            /* The solid color acts as a fallback while the image loads */
            border: 40px solid #c5a059; 
            border-image-source: url('my-frame.png');
            border-image-slice: 60;
            border-image-width: 40px;
            border-image-repeat: stretch;
            
            box-shadow: 
                inset 0px 0px 10px rgba(0,0,0,0.2), 
                0px 15px 35px rgba(0,0,0,0.3);      

            position: relative;
            overflow: hidden; 
            display: inline-block;
            border-radius: 2px;
        }

        .artwork-image {
            max-height: 60vh; /* Reduced slightly to make room for the frame */
            width: auto;
            max-width: 100%;
            display: block;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

    <!-- Style Filter Dropdown -->
    <div id="styleFilterContainer" class="absolute top-6 left-6 md:top-10 md:left-10 z-30">
        <select id="styleFilter" class="bg-transparent border-none text-gray-800 font-['Times_New_Roman'] text-lg md:text-xl outline-none cursor-pointer hover:opacity-70 transition-opacity">
            <option value="painting">All Paintings</option>
            <option value="impressionism painting">Impressionism</option>
            <option value="renaissance painting">Renaissance</option>
            <option value="modern painting">Modern Art</option>
            <option value="portrait painting">Portraits</option>
            <option value="landscape painting">Landscapes</option>
        </select>
    </div>

    <!-- Slideshow Button -->
    <select id="slideshowBtn" class="absolute bottom-6 right-6 md:bottom-10 md:right-10 slideshow-btn outline-none cursor-pointer appearance-none text-center px-4 py-2">
        <option value="" disabled selected hidden>Start Slideshow...</option>
        <option value="with-info">With Info Box</option>
        <option value="without-info">Without Info Box</option>
    </select>

    <!-- Left Navigation Arrow -->
    <button id="prevBtn" class="absolute left-4 md:left-10 top-1/2 -translate-y-1/2 p-2 text-gray-300 hover:text-gray-800 transition-colors duration-300 z-20 focus:outline-none">
        <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
        </svg>
    </button>

    <!-- Artwork Container -->
    <div id="artworkWrapper" class="absolute max-w-[85vw] md:max-w-[70vw] slide-transition opacity-0 translate-x-0 flex flex-col items-center">
        <!-- Dynamic Frame Wrapper -->
        <div class="art-frame">
            <!-- Main Image -->
            <img src="" alt="Artwork" class="artwork-image">
        </div>
        
        <!-- Description Card (Now acts as a placard below) -->
        <div class="description-card max-w-[320px] md:max-w-[500px]">
            <div class="desc-content text-sm md:text-base leading-relaxed"></div>
        </div>
    </div>

    <!-- Right Navigation Arrow -->
    <button id="nextBtn" class="absolute right-4 md:right-10 top-1/2 -translate-y-1/2 p-2 text-gray-300 hover:text-gray-800 transition-colors duration-300 z-20 focus:outline-none">
        <svg class="w-12 h-12 md:w-16 md:h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
        </svg>
    </button>

    <script>
        let artworks = [];
        let currentIndex = 0;
        let isTransitioning = true; // Prevent actions until loaded
        let slideshowInterval = null;
        let isSlideshowActive = false;
        let slideshowMode = null;

        // DOM Elements
        let currentWrapper = document.getElementById('artworkWrapper');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideshowBtn = document.getElementById('slideshowBtn');
        const styleFilterContainer = document.getElementById('styleFilterContainer');
        const styleFilter = document.getElementById('styleFilter');

        // Initial Loading State
        currentWrapper.querySelector('.desc-content').innerHTML = "Fetching masterpieces from the Art Institute of Chicago...";

        // Fetch artworks from the Art Institute of Chicago API
        async function fetchArtworks(searchQuery = "painting") {
            try {
                // Fetch up to 100 items. Randomize page only for broad 'painting' search to avoid hitting empty pages for specific filters.
                const page = searchQuery === "painting" ? Math.floor(Math.random() * 10) + 1 : 1;
                const response = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=${encodeURIComponent(searchQuery)}&query[term][is_public_domain]=true&limit=100&page=${page}&fields=id,title,image_id,artist_title,date_display,thumbnail,medium_display`);
                const data = await response.json();
                
                // Ensure data.data exists before trying to filter it
                if (data && data.data) {
                    // Filter out any items that don't have a valid image ID
                    artworks = data.data.filter(art => art.image_id);
                    
                    // Shuffle the array locally so filters (which always hit page 1) still feel random
                    artworks = artworks.sort(() => Math.random() - 0.5);
                    
                    if(artworks.length > 0) {
                        // Start at the first artwork of the randomized array
                        currentIndex = 0;
                        isTransitioning = false;
                        loadAndDisplayArtwork(currentIndex, 0);
                    } else {
                        currentWrapper.querySelector('.desc-content').innerHTML = "No artworks found for this filter.";
                        currentWrapper.classList.remove('opacity-0');
                    }
                } else {
                    throw new Error(data.detail || "Invalid data structure returned from API.");
                }
            } catch (error) {
                console.error("Error fetching art:", error);
                currentWrapper.querySelector('.desc-content').innerHTML = "Failed to load artworks. Please check your connection.";
                currentWrapper.classList.remove('opacity-0');
            }
        }

        // Filter Event Listener
        styleFilter.addEventListener('change', (e) => {
            if (isTransitioning) return;
            isTransitioning = true;
            currentWrapper.classList.add('opacity-0'); // Fade out current image
            setTimeout(() => {
                currentWrapper.querySelector('.desc-content').innerHTML = `Curating ${e.target.options[e.target.selectedIndex].text}...`;
                fetchArtworks(e.target.value);
            }, 500); // Wait for fade out
        });

        // Function to load and render a specific artwork with transitions
        function loadAndDisplayArtwork(index, direction = 0) {
            isTransitioning = true;
            
            const data = artworks[index];
            
            // Safely extract properties
            const title = data.title || 'Unknown Title';
            const date = data.date_display || 'Unknown Date';
            const artist = data.artist_title || 'Unknown Artist';
            
            // Prioritize alt_text, fallback to medium_display
            const description = (data.thumbnail && data.thumbnail.alt_text) 
                                ? data.thumbnail.alt_text 
                                : (data.medium_display || '');

            // Update the description HTML with a premium gallery layout
            const artworkLink = `https://www.artic.edu/artworks/${data.id}`;
            const formattedDesc = `
                <div class="mb-1">
                    <a href="${artworkLink}" target="_blank" class="font-bold text-lg hover:text-gray-500 transition-colors" title="View on Art Institute of Chicago website">${title}</a> 
                    <span class="italic text-gray-600">(${date})</span>
                </div>
                <div class="font-medium text-gray-800 uppercase text-xs tracking-widest mb-3">${artist}</div>
                <div class="w-10 h-[1px] bg-gray-400 mx-auto mb-3"></div>
                <div class="text-sm text-gray-700 leading-relaxed">${description}</div>
            `;
            
            // Construct the IIIF Image URL
            const imageUrl = `https://www.artic.edu/iiif/2/${data.image_id}/full/843,/0/default.jpg`;
            
            if (direction === 0) {
                // Initial Load (Fade In)
                const artworkImage = currentWrapper.querySelector('img');
                const artworkDesc = currentWrapper.querySelector('.desc-content');
                
                artworkDesc.innerHTML = formattedDesc;
                
                artworkImage.onload = () => {
                    currentWrapper.classList.remove('opacity-0');
                    attachZoom(artworkImage);
                    isTransitioning = false;
                };

                artworkImage.onerror = () => {
                    artworkDesc.innerHTML = "Error loading high-res image. Skipping to next...";
                    currentWrapper.classList.remove('opacity-0'); // Ensure the error text is visible
                    isTransitioning = false; // FIX: Release the transition lock
                    setTimeout(() => navigate(1), 1500);
                };

                artworkImage.src = imageUrl;
                return;
            }

            // For navigation, create a new wrapper to slide in
            const newWrapper = currentWrapper.cloneNode(true);
            
            // Set starting position based on direction
            // Next (1): start off-screen right
            // Prev (-1): start off-screen left
            const startClass = direction === 1 ? 'translate-x-[150vw]' : '-translate-x-[150vw]';
            
            // Initialize the new wrapper's classes
            newWrapper.className = `absolute max-w-[85vw] md:max-w-[70vw] flex flex-col items-center slide-transition opacity-100 ${startClass}`;
            
            const newImage = newWrapper.querySelector('img');
            const newDesc = newWrapper.querySelector('.desc-content');
            
            newDesc.innerHTML = formattedDesc;

            // Append to the DOM so it can load and be ready to slide
            document.body.appendChild(newWrapper);
            
            // Wait for the new image to fully load before triggering the slide animation
            newImage.onload = () => {
                attachZoom(newImage);
                // Force reflow to ensure the starting position is registered by the browser
                void newWrapper.offsetWidth;
                
                // Determine exit direction for current artwork
                const exitClass = direction === 1 ? '-translate-x-[150vw]' : 'translate-x-[150vw]';
                
                // Trigger simultaneous slide
                currentWrapper.classList.remove('translate-x-0');
                currentWrapper.classList.add(exitClass);
                
                newWrapper.classList.remove(startClass);
                newWrapper.classList.add('translate-x-0');
                
                // Clean up old artwork after animation finishes (700ms matches CSS transition)
                setTimeout(() => {
                    currentWrapper.remove();
                    currentWrapper = newWrapper;
                    isTransitioning = false;
                }, 700);
            };

            newImage.onerror = () => {
                newWrapper.remove();
                isTransitioning = false; // FIX: Release the transition lock
                // If it fails to load, gracefully wait a moment then try next
                setTimeout(() => navigate(direction), 1500);
            };

            newImage.src = imageUrl;
        }

        // Function to handle moving left or right through the array
        function navigate(direction) {
            if (isTransitioning || artworks.length === 0) return;
            
            currentIndex += direction;
            
            // Wrap around logic
            if (currentIndex >= artworks.length) currentIndex = 0;
            if (currentIndex < 0) currentIndex = artworks.length - 1;
            
            loadAndDisplayArtwork(currentIndex, direction);
        }

        // Event Listeners for Buttons
        prevBtn.addEventListener('click', () => navigate(-1));
        nextBtn.addEventListener('click', () => navigate(1));

        // Interactive Zoom Logic
        function attachZoom(imgElement) {
            imgElement.style.transition = "transform 0.4s ease-out";
            imgElement.style.cursor = "zoom-in";
            imgElement.style.position = "relative"; // Ensure z-index scaling works

            // 1. Mouse Events (Desktop)
            imgElement.addEventListener("mousemove", function(e) {
                const x = (e.offsetX / this.offsetWidth) * 100;
                const y = (e.offsetY / this.offsetHeight) * 100;
                
                this.style.transformOrigin = `${x}% ${y}%`;
                this.style.transform = "scale(2.5)"; 
                this.style.zIndex = "50"; 
            });

            imgElement.addEventListener("mouseleave", function() {
                resetZoom(this);
            });

            // 2. Touch Events (Mobile)
            imgElement.addEventListener("touchstart", function(e) {
                e.stopPropagation(); // Prevents the touch from being counted as a swipe
                handleTouchZoom(e, this);
            }, { passive: true });

            imgElement.addEventListener("touchmove", function(e) {
                e.stopPropagation(); // Prevents the drag from being counted as a swipe
                handleTouchZoom(e, this);
            }, { passive: true });

            imgElement.addEventListener("touchend", function(e) {
                e.stopPropagation(); // Stops the release from triggering the next painting
                resetZoom(this);
            });

            // Helper for touch zoom calculations
            function handleTouchZoom(e, img) {
                if (e.touches.length > 0) {
                    const touch = e.touches[0];
                    const rect = img.getBoundingClientRect();
                    
                    // Calculate touch position relative to the image bounding box
                    let x = ((touch.clientX - rect.left) / rect.width) * 100;
                    let y = ((touch.clientY - rect.top) / rect.height) * 100;
                    
                    // Clamp values so zoom doesn't drift off screen
                    x = Math.max(0, Math.min(100, x));
                    y = Math.max(0, Math.min(100, y));

                    img.style.transformOrigin = `${x}% ${y}%`;
                    img.style.transform = "scale(2.5)"; 
                    img.style.zIndex = "50";
                }
            }

            // Helper to reset zoom state
            function resetZoom(img) {
                img.style.transform = "scale(1)";
                img.style.zIndex = "1";
                
                setTimeout(() => {
                    if (img.style.transform === "scale(1)") {
                        img.style.transformOrigin = "center center";
                    }
                }, 400); 
            }
        }

        // Slideshow Logic
        function startSlideshow(mode) {
            isSlideshowActive = true;
            slideshowMode = mode;
            
            slideshowBtn.style.display = 'none';
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'none';
            styleFilterContainer.style.display = 'none';
            
            if (mode === 'without-info') {
                document.body.classList.add('hide-info');
            }
            
            // Advance automatically every 2 minutes (120,000 milliseconds)
            slideshowInterval = setInterval(() => {
                navigate(1);
            }, 120000); 
        }

        function stopSlideshow() {
            if (!isSlideshowActive) return;
            isSlideshowActive = false;
            slideshowMode = null;
            
            slideshowBtn.style.display = 'block';
            slideshowBtn.value = ""; // Reset the dropdown back to the placeholder
            prevBtn.style.display = 'block';
            nextBtn.style.display = 'block';
            styleFilterContainer.style.display = 'block';
            
            document.body.classList.remove('hide-info');
            
            clearInterval(slideshowInterval);
        }

        slideshowBtn.addEventListener('change', (e) => {
            if (e.target.value) {
                startSlideshow(e.target.value);
            }
        });

        // Event Listeners for Keyboard (Left and Right Arrows, Spacebar for Slideshow Exit)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') navigate(-1);
            if (e.key === 'ArrowRight') navigate(1);
            if (e.code === 'Space') {
                e.preventDefault(); 
                stopSlideshow();
            }
        });

        // Mobile Swipe & Tap-to-Exit Logic
        let touchStartX = 0;
        let touchEndX = 0;
        
        window.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        window.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50; // Minimum pixels to count as a swipe
            if (touchEndX < touchStartX - swipeThreshold) {
                if (isSlideshowActive) stopSlideshow();
                navigate(1); // Swipe left -> Next
            } else if (touchEndX > touchStartX + swipeThreshold) {
                if (isSlideshowActive) stopSlideshow();
                navigate(-1); // Swipe right -> Prev
            }
        }

        // Tap anywhere to exit slideshow on mobile
        document.body.addEventListener('click', (e) => {
            if (isSlideshowActive && e.target.id !== 'slideshowBtn') {
                stopSlideshow();
            }
        });

        // Initialize the app by fetching data
        fetchArtworks();
    </script>
</body>
</html>
